services:
  production-activation-preflight:
    image: ${CONTROLLED_IMAGE:?set immutable controlled image digest}
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 64
    environment:
      APP_ENV: production
      CONTROLLED_IMAGE: ${CONTROLLED_IMAGE:?set immutable controlled image digest}
      GIT_SHA: ${GIT_SHA:?set exact candidate GIT_SHA}
      PRODUCTION_PROFILE: ${PRODUCTION_PROFILE:-full}
      ACTIVATION_EVIDENCE_SOURCE_SHA: ${ACTIVATION_EVIDENCE_SOURCE_SHA:?set evidence source SHA equal to GIT_SHA}
      ACTIVATION_EVIDENCE_IMAGE_DIGEST: ${ACTIVATION_EVIDENCE_IMAGE_DIGEST:?set evidence image digest equal to CONTROLLED_IMAGE digest}
      ACTIVATION_EVIDENCE_CONFIGURATION_DIGEST: ${ACTIVATION_EVIDENCE_CONFIGURATION_DIGEST:?set reviewed activation configuration digest}
      ACTIVATION_EVIDENCE_ENVIRONMENT_ID: ${ACTIVATION_EVIDENCE_ENVIRONMENT_ID:?set stable target environment identity}
      ACTIVATION_EVIDENCE_MANIFEST_FILE: /run/nexus/activation/manifest.json
      ACTIVATION_EVIDENCE_PUBLIC_KEY_FILE: /run/nexus/activation/public_key.pem
      ACTIVATION_EVIDENCE_KEY_ID: ${ACTIVATION_EVIDENCE_KEY_ID:?set reviewed Ed25519 verification key id}
      PRODUCTION_E2E_EVIDENCE_URL: ${PRODUCTION_E2E_EVIDENCE_URL:-}
      PROVIDER_CANARY_E2E_EVIDENCE_URL: ${PROVIDER_CANARY_E2E_EVIDENCE_URL:-}
      WEBCHAT_AI_PRODUCTION_E2E_EVIDENCE_URL: ${WEBCHAT_AI_PRODUCTION_E2E_EVIDENCE_URL:-}
      TELEPHONY_PRODUCTION_E2E_EVIDENCE_URL: ${TELEPHONY_PRODUCTION_E2E_EVIDENCE_URL:-}
      OUTBOUND_PRODUCTION_E2E_EVIDENCE_URL: ${OUTBOUND_PRODUCTION_E2E_EVIDENCE_URL:-}
      WHATSAPP_PRODUCTION_E2E_EVIDENCE_URL: ${WHATSAPP_PRODUCTION_E2E_EVIDENCE_URL:-}
      OPERATIONS_PRODUCTION_E2E_EVIDENCE_URL: ${OPERATIONS_PRODUCTION_E2E_EVIDENCE_URL:-}
      PROVIDER_RUNTIME_ENABLED: ${PROVIDER_RUNTIME_ENABLED:-false}
      PROVIDER_RUNTIME_TRAFFIC_MODE: ${PROVIDER_RUNTIME_TRAFFIC_MODE:-control}
      PROVIDER_RUNTIME_KILL_SWITCH: ${PROVIDER_RUNTIME_KILL_SWITCH:-true}
      PROVIDER_RUNTIME_CANARY_PERCENT: ${PROVIDER_RUNTIME_CANARY_PERCENT:-0}
      WEBCHAT_AI_ENABLED: ${WEBCHAT_AI_ENABLED:-false}
      WEBCHAT_AI_AUTO_REPLY_MODE: ${WEBCHAT_AI_AUTO_REPLY_MODE:-off}
      WEBCHAT_HUMAN_CALL_ENABLED: ${WEBCHAT_HUMAN_CALL_ENABLED:-false}
      WEBCHAT_LIVE_AI_VOICE_ENABLED: ${WEBCHAT_LIVE_AI_VOICE_ENABLED:-false}
      WEBCHAT_VOICE_PROVIDER: ${WEBCHAT_VOICE_PROVIDER:-mock}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_API_KEY_FILE: ${LIVEKIT_API_KEY_FILE:-}
      LIVEKIT_API_SECRET_FILE: ${LIVEKIT_API_SECRET_FILE:-}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      LIVEKIT_AGENT_SHARED_SECRET: ${LIVEKIT_AGENT_SHARED_SECRET:-}
      LIVEKIT_AGENT_SHARED_SECRET_FILE: ${LIVEKIT_AGENT_SHARED_SECRET_FILE:-}
      LIVEKIT_WEBHOOK_ENABLED: ${LIVEKIT_WEBHOOK_ENABLED:-false}
      NEXUS_VOICE_STT_MODEL: ${NEXUS_VOICE_STT_MODEL:-}
      NEXUS_VOICE_TTS_MODEL: ${NEXUS_VOICE_TTS_MODEL:-}
      ENABLE_OUTBOUND_DISPATCH: ${ENABLE_OUTBOUND_DISPATCH:-false}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-disabled}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_SIDECAR_IMAGE: ${WHATSAPP_SIDECAR_IMAGE:-}
      WHATSAPP_META_WEBHOOK_PUBLIC_URL: ${WHATSAPP_META_WEBHOOK_PUBLIC_URL:-}
      WHATSAPP_EMBEDDED_SIGNUP_ENABLED: ${WHATSAPP_EMBEDDED_SIGNUP_ENABLED:-false}
      WHATSAPP_META_APP_ID: ${WHATSAPP_META_APP_ID:-}
      WHATSAPP_META_APP_SECRET_FILE: ${WHATSAPP_META_APP_SECRET_FILE:-/run/nexus/whatsapp_meta_app_secret}
      WHATSAPP_META_CONFIGURATION_ID: ${WHATSAPP_META_CONFIGURATION_ID:-}
      WHATSAPP_META_GRAPH_API_VERSION: ${WHATSAPP_META_GRAPH_API_VERSION:-}
      WHATSAPP_EMBEDDED_SIGNUP_ALLOWED_ORIGIN: ${WHATSAPP_EMBEDDED_SIGNUP_ALLOWED_ORIGIN:-}
      WHATSAPP_MEDIA_ENABLED: ${WHATSAPP_MEDIA_ENABLED:-false}
      WHATSAPP_MEDIA_SCANNER: ${WHATSAPP_MEDIA_SCANNER:-disabled}
      WHATSAPP_CLAMAV_HOST: ${WHATSAPP_CLAMAV_HOST:-clamav-controlled}
      WHATSAPP_CLAMAV_PORT: ${WHATSAPP_CLAMAV_PORT:-3310}
      WHATSAPP_CLAMAV_TIMEOUT_SECONDS: ${WHATSAPP_CLAMAV_TIMEOUT_SECONDS:-20}
      WHATSAPP_MEDIA_MAX_TOTAL_BYTES: ${WHATSAPP_MEDIA_MAX_TOTAL_BYTES:-104857600}
      WHATSAPP_CLAMAV_IMAGE: ${WHATSAPP_CLAMAV_IMAGE:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      OPERATIONS_DISPATCH_MODE: ${OPERATIONS_DISPATCH_MODE:-disabled}
      OPERATIONS_DISPATCH_ADAPTER: ${OPERATIONS_DISPATCH_ADAPTER:-disabled}
    volumes:
      - ${NEXUS_ACTIVATION_EVIDENCE_MANIFEST_HOST_PATH:?set signed activation manifest path}:/run/nexus/activation/manifest.json:ro
      - ${NEXUS_ACTIVATION_EVIDENCE_PUBLIC_KEY_HOST_PATH:?set Ed25519 public key path}:/run/nexus/activation/public_key.pem:ro
    command:
      - python
      - /app/scripts/deploy/validate_production_activation.py
      - --environment

  clamav-controlled:
    image: ${WHATSAPP_CLAMAV_IMAGE:?set immutable ClamAV image as name@sha256:<64-hex>}
    profiles:
      - whatsapp-media
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run/clamav:rw,noexec,nosuid,size=64m
    pids_limit: 256
    networks:
      - controlled
    volumes:
      - clamav-database:/var/lib/clamav
    healthcheck:
      test:
        - CMD
        - clamdscan
        - --ping=1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  app-controlled:
    environment:
      APP_ENV: production
      PRODUCTION_PROFILE: ${PRODUCTION_PROFILE:-full}
      ACTIVATION_EVIDENCE_SOURCE_SHA: ${ACTIVATION_EVIDENCE_SOURCE_SHA:?set evidence source SHA equal to GIT_SHA}
      ACTIVATION_EVIDENCE_IMAGE_DIGEST: ${ACTIVATION_EVIDENCE_IMAGE_DIGEST:?set evidence image digest equal to CONTROLLED_IMAGE digest}
      ACTIVATION_EVIDENCE_CONFIGURATION_DIGEST: ${ACTIVATION_EVIDENCE_CONFIGURATION_DIGEST:?set reviewed activation configuration digest}
      ACTIVATION_EVIDENCE_ENVIRONMENT_ID: ${ACTIVATION_EVIDENCE_ENVIRONMENT_ID:?set stable target environment identity}
      ACTIVATION_EVIDENCE_MANIFEST_FILE: /run/nexus/activation/manifest.json
      ACTIVATION_EVIDENCE_PUBLIC_KEY_FILE: /run/nexus/activation/public_key.pem
      ACTIVATION_EVIDENCE_KEY_ID: ${ACTIVATION_EVIDENCE_KEY_ID:?set reviewed Ed25519 verification key id}
      PRODUCTION_E2E_EVIDENCE_URL: ${PRODUCTION_E2E_EVIDENCE_URL:-}
      PROVIDER_CANARY_E2E_EVIDENCE_URL: ${PROVIDER_CANARY_E2E_EVIDENCE_URL:-}
      WEBCHAT_AI_PRODUCTION_E2E_EVIDENCE_URL: ${WEBCHAT_AI_PRODUCTION_E2E_EVIDENCE_URL:-}
      TELEPHONY_PRODUCTION_E2E_EVIDENCE_URL: ${TELEPHONY_PRODUCTION_E2E_EVIDENCE_URL:-}
      OUTBOUND_PRODUCTION_E2E_EVIDENCE_URL: ${OUTBOUND_PRODUCTION_E2E_EVIDENCE_URL:-}
      WHATSAPP_PRODUCTION_E2E_EVIDENCE_URL: ${WHATSAPP_PRODUCTION_E2E_EVIDENCE_URL:-}
      OPERATIONS_PRODUCTION_E2E_EVIDENCE_URL: ${OPERATIONS_PRODUCTION_E2E_EVIDENCE_URL:-}
      ENABLE_OUTBOUND_DISPATCH: ${ENABLE_OUTBOUND_DISPATCH:-false}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-disabled}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_META_WEBHOOK_PUBLIC_URL: ${WHATSAPP_META_WEBHOOK_PUBLIC_URL:-}
      WHATSAPP_EMBEDDED_SIGNUP_ENABLED: ${WHATSAPP_EMBEDDED_SIGNUP_ENABLED:-false}
      WHATSAPP_META_APP_ID: ${WHATSAPP_META_APP_ID:-}
      WHATSAPP_META_APP_SECRET_FILE: ${WHATSAPP_META_APP_SECRET_FILE:-/run/nexus/whatsapp_meta_app_secret}
      WHATSAPP_META_CONFIGURATION_ID: ${WHATSAPP_META_CONFIGURATION_ID:-}
      WHATSAPP_META_GRAPH_API_VERSION: ${WHATSAPP_META_GRAPH_API_VERSION:-}
      WHATSAPP_EMBEDDED_SIGNUP_ALLOWED_ORIGIN: ${WHATSAPP_EMBEDDED_SIGNUP_ALLOWED_ORIGIN:-}
      WHATSAPP_MEDIA_ENABLED: ${WHATSAPP_MEDIA_ENABLED:-false}
      WHATSAPP_MEDIA_SCANNER: ${WHATSAPP_MEDIA_SCANNER:-disabled}
      WHATSAPP_CLAMAV_HOST: ${WHATSAPP_CLAMAV_HOST:-clamav-controlled}
      WHATSAPP_CLAMAV_PORT: ${WHATSAPP_CLAMAV_PORT:-3310}
      WHATSAPP_CLAMAV_TIMEOUT_SECONDS: ${WHATSAPP_CLAMAV_TIMEOUT_SECONDS:-20}
      WHATSAPP_MEDIA_MAX_TOTAL_BYTES: ${WHATSAPP_MEDIA_MAX_TOTAL_BYTES:-104857600}
    volumes:
      - ${NEXUS_ACTIVATION_EVIDENCE_MANIFEST_HOST_PATH:?set signed activation manifest path}:/run/nexus/activation/manifest.json:ro
      - ${NEXUS_ACTIVATION_EVIDENCE_PUBLIC_KEY_HOST_PATH:?set Ed25519 public key path}:/run/nexus/activation/public_key.pem:ro
    depends_on:
      migrate-controlled:
        condition: service_completed_successfully
      production-activation-preflight:
        condition: service_completed_successfully
      clamav-controlled:
        condition: service_healthy
        required: false

  worker-outbound-controlled:
    environment:
      ENABLE_OUTBOUND_DISPATCH: ${ENABLE_OUTBOUND_DISPATCH:-false}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-disabled}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_META_WEBHOOK_PUBLIC_URL: ${WHATSAPP_META_WEBHOOK_PUBLIC_URL:-}
    depends_on:
      app-controlled:
        condition: service_healthy
      production-activation-preflight:
        condition: service_completed_successfully

  worker-background-controlled:
    environment:
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_MEDIA_ENABLED: ${WHATSAPP_MEDIA_ENABLED:-false}
      WHATSAPP_MEDIA_SCANNER: ${WHATSAPP_MEDIA_SCANNER:-disabled}
      WHATSAPP_CLAMAV_HOST: ${WHATSAPP_CLAMAV_HOST:-clamav-controlled}
      WHATSAPP_CLAMAV_PORT: ${WHATSAPP_CLAMAV_PORT:-3310}
      WHATSAPP_CLAMAV_TIMEOUT_SECONDS: ${WHATSAPP_CLAMAV_TIMEOUT_SECONDS:-20}
      WHATSAPP_MEDIA_MAX_TOTAL_BYTES: ${WHATSAPP_MEDIA_MAX_TOTAL_BYTES:-104857600}
    volumes:
      - ${NEXUS_WHATSAPP_SECRETS_HOST_PATH:?set WhatsApp secrets directory}:/run/nexus:ro
    depends_on:
      app-controlled:
        condition: service_healthy
      production-activation-preflight:
        condition: service_completed_successfully
      clamav-controlled:
        condition: service_healthy
        required: false

volumes:
  clamav-database:
