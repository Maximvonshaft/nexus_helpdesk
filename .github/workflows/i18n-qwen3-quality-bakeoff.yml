name: I18N Qwen3 Quality Bakeoff

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/i18n/qwen3_quality_bakeoff.py
      - .github/workflows/i18n-qwen3-quality-bakeoff.yml

permissions:
  contents: read

jobs:
  qwen3-quality-bakeoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact tooling candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned CPU inference toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.57.6' 'accelerate==1.9.0' 'safetensors==0.8.0'

      - name: Run contextual translation bakeoff
        id: bakeoff
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -uo pipefail
          mkdir -p /tmp/nexus-i18n-qwen3-bakeoff
          set +e
          python scripts/i18n/qwen3_quality_bakeoff.py \
            --output /tmp/nexus-i18n-qwen3-bakeoff \
            --batch-size 16 \
            2>&1 | tee /tmp/nexus-i18n-qwen3-bakeoff/bakeoff.log
          status=${PIPESTATUS[0]}
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf '{"schema":"nexus.i18n-qwen3-bakeoff-result.v1","status":%s,"head_sha":"%s"}\n' \
            "$status" "${{ github.event.pull_request.head.sha }}" \
            > /tmp/nexus-i18n-qwen3-bakeoff/bakeoff-result.json
          exit 0

      - name: Upload immutable bakeoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i18n-qwen3-quality-bakeoff-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/nexus-i18n-qwen3-bakeoff

      - name: Enforce bakeoff result
        if: always() && steps.bakeoff.outputs.status != '0'
        run: |
          echo 'Qwen3 quality bakeoff failed; inspect the uploaded bakeoff.log.' >&2
          exit 1
