name: one-shot-909-final-main-evidence

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  trace-token-flow:
    if: github.head_ref == 'audit/909-final-main-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TARGET_SHA: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
      SOURCE_SHA: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
      RC_SOURCE_SHA: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
      RC_ENV_FILE: deploy/.env.rc-test
      RC_EVIDENCE_DIR: artifacts/rc-test
      RC_RUN_BROWSER_SMOKE: "true"
      RC_BASE_URL: http://127.0.0.1:18083
      RC_PUBLIC_ORIGIN: http://127.0.0.1:18083
      COMPOSE_PROJECT_NAME: nexus_token_diag_${{ github.run_id }}
      CANDIDATE_IMAGE: nexusdesk/helpdesk:rc-token-diagnostic-55ee9165
      RC_POSTGRES_IMAGE_PIN: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
      RC_NGINX_IMAGE_PIN: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
      OUTPUT_DIR: artifacts/webchat-token-flow
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
          fetch-depth: 0
          persist-credentials: false

      - name: Require unchanged exact main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install locked browser dependencies
        working-directory: webapp
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Reproduce browser failure
        id: reproduce
        shell: bash
        run: |
          set +e
          bash scripts/release/run_controlled_rc_gate.sh
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test "$code" -ne 0

      - name: Build credential-free token flow evidence
        if: always()
        shell: bash
        env:
          RC_EXIT_CODE: ${{ steps.reproduce.outputs.exit_code }}
        run: |
          set -Eeuo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          trace="$(find webapp/test-results -type f -name trace.zip -print -quit)"
          test -n "$trace"
          python - "$trace" "$OUTPUT_DIR/token-flow.json" "$SOURCE_SHA" "${RC_EXIT_CODE:-unknown}" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import PurePosixPath
          from urllib.parse import urlparse

          trace_path, output_path, source_sha, exit_code = sys.argv[1:]

          def header_value(headers, name):
              wanted = name.lower()
              if isinstance(headers, dict):
                  for key, value in headers.items():
                      if str(key).lower() == wanted:
                          return str(value)
              if isinstance(headers, list):
                  for item in headers:
                      if isinstance(item, dict) and str(item.get('name', '')).lower() == wanted:
                          return str(item.get('value', ''))
              return None

          def digest(value):
              if value is None:
                  return None
              return hashlib.sha256(value.encode('utf-8')).hexdigest()[:16]

          records = []
          with zipfile.ZipFile(trace_path) as archive:
              names = set(archive.namelist())

              def read_resource(identifier):
                  if not identifier:
                      return None
                  candidates = [
                      f'resources/{identifier}',
                      str(PurePosixPath('resources') / str(identifier)),
                  ]
                  for candidate in candidates:
                      if candidate in names:
                          return archive.read(candidate)
                  return None

              for name in sorted(names):
                  if not (name.endswith('.network') or name.endswith('.trace')):
                      continue
                  raw = archive.read(name).decode('utf-8', errors='replace')
                  for line in raw.splitlines():
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      snapshot = event.get('snapshot') if isinstance(event, dict) else None
                      if not isinstance(snapshot, dict):
                          continue
                      request = snapshot.get('request')
                      response = snapshot.get('response')
                      if not isinstance(request, dict):
                          continue
                      url = str(request.get('url') or '')
                      if '/api/webchat/' not in url:
                          continue
                      path = urlparse(url).path
                      query = urlparse(url).query
                      token = header_value(request.get('headers'), 'x-webchat-visitor-token')
                      record = {
                          'method': str(request.get('method') or ''),
                          'path': path,
                          'query': query or None,
                          'request_token_sha256_prefix': digest(token),
                          'status': response.get('status') if isinstance(response, dict) else None,
                      }
                      if path == '/api/webchat/init' and isinstance(response, dict):
                          content = response.get('content')
                          body = None
                          if isinstance(content, dict):
                              body = read_resource(content.get('_sha1') or content.get('sha1'))
                              if body is None and isinstance(content.get('text'), str):
                                  body = content['text'].encode('utf-8')
                          if body:
                              try:
                                  payload = json.loads(body.decode('utf-8'))
                              except Exception:
                                  payload = None
                              if isinstance(payload, dict):
                                  record['response_conversation_id'] = payload.get('conversation_id')
                                  record['response_token_sha256_prefix'] = digest(
                                      str(payload.get('visitor_token')) if payload.get('visitor_token') is not None else None
                                  )
                      records.append(record)

          payload = {
              'schema': 'nexus.webchat-token-flow.v1',
              'source_sha': source_sha,
              'rc_exit_code': exit_code,
              'records': records,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
          cp "$RC_EVIDENCE_DIR/browser-smoke.txt" "$OUTPUT_DIR/browser-smoke.txt"
          cp "$RC_EVIDENCE_DIR/nginx-rc.log" "$OUTPUT_DIR/nginx-rc.log"
          test -s "$OUTPUT_DIR/token-flow.json"
          jq . "$OUTPUT_DIR/token-flow.json"

      - name: Upload credential-free token flow
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webchat-token-flow-55ee9165
          path: artifacts/webchat-token-flow
          retention-days: 3
          if-no-files-found: error
