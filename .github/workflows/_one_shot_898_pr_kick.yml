name: one-shot-898-pr-kick

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  kick:
    if: github.head_ref == 'fix/898-webchat-recovery-and-gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply root-cause remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/_one_shot_898_fix.py
          node --check backend/app/static/webchat/widget.js
          python -m compileall -q backend/tests
          git diff --check
          test ! -e .github/workflows/_one_shot_898_remediation.yml
          test ! -e .github/workflows/_one_shot_898_pr_kick.yml
          test ! -e scripts/_one_shot_898_fix.py
          ! grep -R --fixed-strings 'webchat-session-recovery-v2' backend/app/static/webchat backend/tests/test_webchat_ws_static_contracts.py
          ! grep -R --fixed-strings 'Promise.resolve(false)' backend/app/static/webchat/widget.js

      - name: Commit final remediation tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(webchat): coordinate recovery and close acceptance gaps"
          git push origin HEAD:fix/898-webchat-recovery-and-gates
