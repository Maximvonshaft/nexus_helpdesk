name: Local Runtime Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/local-source-export.yml
      - docs/local-export-link.md

permissions:
  contents: read

jobs:
  export-local-runtime:
    if: github.event.pull_request.head.ref == 'automation/local-export-20260803-ai-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          submodules: false

      - name: Record immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          printf '%s\n' "${{ github.event.pull_request.base.sha }}" > BASE_SOURCE_COMMIT.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > EXPORT_HEAD_COMMIT.txt
          git status --short

      - name: Build bounded source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r nexus-source.zip . \
            -x '.git/*' \
               'node_modules/*' \
               'webapp/node_modules/*' \
               'frontend_dist/*' \
               '**/__pycache__/*' \
               '**/.pytest_cache/*' \
               '**/.mypy_cache/*' \
               '**/.ruff_cache/*' \
               '**/.venv/*' \
               '**/venv/*' \
               '*.env' \
               '.env' \
               '.env.*'
          sha256sum nexus-source.zip > NEXUS_SOURCE_SHA256SUMS.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install exact frontend dependency lock
        working-directory: webapp
        run: npm ci

      - name: Verify and build current frontend baseline
        working-directory: webapp
        run: |
          npm run architecture
          npm run typecheck
          npm run build

      - name: Archive exact frontend dependencies and baseline build
        shell: bash
        run: |
          set -euo pipefail
          tar -czf nexus-webapp-node-modules.tgz -C webapp node_modules
          tar -czf nexus-frontend-dist-before.tgz frontend_dist
          sha256sum nexus-webapp-node-modules.tgz nexus-frontend-dist-before.tgz > NEXUS_FRONTEND_SHA256SUMS.txt

      - name: Install Playwright Firefox runtime
        working-directory: webapp
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
        run: npx playwright install firefox

      - name: Archive browser runtime
        shell: bash
        run: |
          set -euo pipefail
          find playwright-browsers -maxdepth 4 -type f \( -name firefox -o -name firefox-bin \) | sort > PLAYWRIGHT_FIREFOX_FILES.txt
          tar -czf nexus-playwright-firefox-1.61.1.tgz playwright-browsers
          sha256sum nexus-playwright-firefox-1.61.1.tgz > PLAYWRIGHT_FIREFOX_SHA256SUMS.txt

      - name: Upload local runtime export
        uses: actions/upload-artifact@v4
        with:
          name: nexus-local-runtime-full-fa7da390
          path: |
            nexus-source.zip
            NEXUS_SOURCE_SHA256SUMS.txt
            nexus-webapp-node-modules.tgz
            nexus-frontend-dist-before.tgz
            NEXUS_FRONTEND_SHA256SUMS.txt
            nexus-playwright-firefox-1.61.1.tgz
            PLAYWRIGHT_FIREFOX_FILES.txt
            PLAYWRIGHT_FIREFOX_SHA256SUMS.txt
            BASE_SOURCE_COMMIT.txt
            EXPORT_HEAD_COMMIT.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
