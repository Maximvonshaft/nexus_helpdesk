name: one-shot-909-final-main-evidence

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'audit/909-final-main-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
      OUTPUT_DIR: artifacts/final-main-diagnostic
    steps:
      - name: Extract exact controlled-candidate failure
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          mkdir -p "$OUTPUT_DIR"
          gh api "repos/${REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=workflow_run&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "controlled-candidate-convergence" and .head_sha == env.TARGET_SHA and .head_branch == "main" and .event == "workflow_run")][0] | {id, name, status, conclusion, event, head_branch, head_sha, html_url, jobs_url, artifacts_url, created_at, updated_at}' \
            > "$OUTPUT_DIR/run.json"
          run_id="$(jq -r '.id' "$OUTPUT_DIR/run.json")"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
            --jq '{jobs: [.jobs[] | {id, name, status, conclusion, started_at, completed_at, steps: [.steps[] | {name, status, conclusion, number}]}]}' \
            > "$OUTPUT_DIR/jobs.json"
          gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '{artifacts: [.artifacts[] | {id, name, size_in_bytes, expired, created_at, expires_at, digest}]}' \
            > "$OUTPUT_DIR/artifacts.json"
          jq . "$OUTPUT_DIR/run.json"
          jq -r '.jobs[] | [.id, .name, .status, (.conclusion // "")] | @tsv' "$OUTPUT_DIR/jobs.json"
          jq -r '.artifacts[] | [.id, .name, .size_in_bytes, (.digest // "")] | @tsv' "$OUTPUT_DIR/artifacts.json"

      - name: Upload bounded diagnostic metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-main-diagnostic-55ee9165
          path: artifacts/final-main-diagnostic
          retention-days: 3
          if-no-files-found: error
