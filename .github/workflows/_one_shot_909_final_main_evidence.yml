name: one-shot-909-final-main-evidence

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'audit/909-final-main-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
          persist-credentials: false
      - name: Print bounded token-authority excerpts
        shell: bash
        run: |
          set -Eeuo pipefail
          file=backend/app/static/webchat/widget.js
          grep -n -E 'legacyVisitorToken[[:space:]]*=|rememberPublicSession|recoverLegacySession|pollLegacy\(' "$file"
          while IFS=: read -r line _; do
            start=$(( line > 8 ? line - 8 : 1 ))
            end=$(( line + 12 ))
            echo "--- lines ${start}-${end}"
            sed -n "${start},${end}p" "$file"
          done < <(grep -n -E 'legacyVisitorToken[[:space:]]*=|rememberPublicSession' "$file")
