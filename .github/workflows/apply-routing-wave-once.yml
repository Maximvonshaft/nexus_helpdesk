name: Apply Routing Wave Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/maintenance/apply_routing_wave_once.py
      - .github/workflows/apply-routing-wave-once.yml
  push:
    branches:
      - feat/whatsapp-dual-transport-production-final
    paths:
      - scripts/maintenance/apply_routing_wave_once.py
      - .github/workflows/apply-routing-wave-once.yml

concurrency:
  group: apply-routing-wave-once
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact routing branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.EXACT_HEAD }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply exact fail-closed patch
        shell: bash
        run: |
          exec > >(tee /tmp/routing-wave-once.log) 2>&1
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/maintenance/apply_routing_wave_once.py")
          text = path.read_text(encoding="utf-8")
          old = "backend/tests/test_audit_838_r5_handoff_authority.py"
          new = "backend/tests/test_control_tower_contract.py"
          if text.count(old) != 2:
              raise SystemExit("routing_patch_focus_anchor_invalid")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python scripts/maintenance/apply_routing_wave_once.py
          mv .github/workflows/apply-routing-wave-once.yml /tmp/apply-routing-wave-once.yml
          git diff --check
      - name: Verify routing authority and repository contracts
        shell: bash
        env:
          PYTHONPATH: backend
          APP_ENV: test
          AUTO_INIT_DB: 'false'
          SEED_DEMO_DATA: 'false'
          ALLOW_DEV_AUTH: 'false'
        run: |
          exec > >(tee -a /tmp/routing-wave-once.log) 2>&1
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend/app backend/tests scripts/release
          python scripts/verify_repository.py --static-only \
            --expected-sha "$EXACT_HEAD" \
            --evidence-out /tmp/routing-wave-static.json
          python -m pytest -q \
            backend/tests/test_audit_838_r5_case_scenario_authority.py \
            backend/tests/test_audit_838_r5_handoff_authority.py \
            backend/tests/test_audit_838_r6_scenario_routing.py \
            backend/tests/test_agent_routing_scope_fifo.py \
            backend/tests/test_conversation_first_agent_routing.py \
            backend/tests/test_conversation_first_agent_routing_residuals.py \
            backend/tests/test_webchat_handoff_control.py \
            backend/tests/test_operator_queue_current_scopes.py \
            backend/tests/test_production_readiness_convergence.py \
            backend/tests/test_repository_contract_suites.py
          python -m pytest -q scripts/release/tests/test_controlled_image_assurance_order.py
      - name: Commit converged product and remove executor
        shell: bash
        run: |
          exec > >(tee -a /tmp/routing-wave-once.log) 2>&1
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git fetch --no-tags origin feat/whatsapp-dual-transport-production-final
          test "$(git rev-parse origin/feat/whatsapp-dual-transport-production-final)" = "$EXACT_HEAD"
          rm -f \
            scripts/maintenance/apply_routing_wave_once.py \
            artifacts/routing-wave-once-failure.txt
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "nexus-routing-convergence"
          git config user.email "nexus-routing-convergence@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-routing-wave-once.yml \
            scripts/maintenance/apply_routing_wave_once.py \
            artifacts/routing-wave-once-failure.txt
          git add \
            .github/workflows/canonical-acceptance.yml \
            backend \
            deploy
          git diff --cached --check
          git commit -m "feat(routing): converge scenario-governed handoff authority"
          git push origin HEAD:feat/whatsapp-dual-transport-production-final
      - name: Persist bounded failure evidence
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.EXACT_HEAD }}
        run: |
          set -Eeuo pipefail
          tail -n 180 /tmp/routing-wave-once.log 2>/dev/null \
            | sed -E 's/(TOKEN|SECRET|PASSWORD|API_KEY)=([^[:space:]]+)/\1=[REDACTED]/g' \
            > /tmp/routing-wave-once-tail.txt || true
          {
            printf 'exact_head=%s\n' "$SOURCE_SHA"
            printf 'result=fail_closed\n\n'
            cat /tmp/routing-wave-once-tail.txt
          } > /tmp/routing-wave-once-failure.txt
          git fetch --no-tags origin feat/whatsapp-dual-transport-production-final
          if test "$(git rev-parse HEAD)" = "$SOURCE_SHA" && \
             test "$(git rev-parse origin/feat/whatsapp-dual-transport-production-final)" = "$SOURCE_SHA"; then
            mkdir -p artifacts
            cp /tmp/routing-wave-once-failure.txt artifacts/routing-wave-once-failure.txt
            git config user.name "nexus-routing-convergence"
            git config user.email "nexus-routing-convergence@users.noreply.github.com"
            git add artifacts/routing-wave-once-failure.txt
            git commit -m "chore(routing): record fail-closed executor evidence"
            git push origin HEAD:feat/whatsapp-dual-transport-production-final
          fi
          {
            printf '%s\n' '<!-- nexus-routing-once-diagnostic -->'
            printf '### R6 Routing one-time executor failed\n\n'
            printf -- '- Exact Head: `%s`\n' "$SOURCE_SHA"
            printf -- '- Result: fail-closed; no generated product commit was pushed.\n\n'
            printf '```text\n'
            cat /tmp/routing-wave-once-tail.txt
            printf '\n```\n'
          } > /tmp/routing-wave-once-comment.md
          gh api \
            --method POST \
            repos/Maximvonshaft/nexus_helpdesk/issues/838/comments \
            -f body="$(cat /tmp/routing-wave-once-comment.md)"
