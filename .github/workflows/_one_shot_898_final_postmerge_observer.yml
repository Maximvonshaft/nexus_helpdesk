name: one-shot-898-final-postmerge-observer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    if: github.head_ref == 'audit/898-final-postmerge-observer-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIN_SHA: 36ccc400ab4a3b612fa4e5f3bed0a5e0d65a68c9
      CANONICAL_RUN_ID: '30779665117'
      CONTROLLED_RUN_ID: '30779925652'
      EVIDENCE_DIR: artifacts/final-postmerge-observer
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 36ccc400ab4a3b612fa4e5f3bed0a5e0d65a68c9
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen official workflow identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["MAIN_SHA"]
          canonical_id = int(os.environ["CANONICAL_RUN_ID"])
          controlled_id = int(os.environ["CONTROLLED_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          out = Path(os.environ["EVIDENCE_DIR"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nexus-final-postmerge-observer",
          }

          def get(path):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          canonical = get(f"/repos/{repo}/actions/runs/{canonical_id}")
          controlled = get(f"/repos/{repo}/actions/runs/{controlled_id}")
          jobs = get(f"/repos/{repo}/actions/runs/{controlled_id}/jobs?per_page=100").get("jobs", [])
          artifacts = get(f"/repos/{repo}/actions/runs/{controlled_id}/artifacts?per_page=100").get("artifacts", [])

          expected_canonical = {
              "name": "Canonical Acceptance",
              "event": "push",
              "head_branch": "main",
              "head_sha": sha,
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in expected_canonical.items():
              assert canonical.get(key) == value, (key, canonical.get(key), value)
          assert controlled.get("name") == "controlled-candidate-convergence"
          assert controlled.get("event") == "workflow_run"
          assert controlled.get("status") == "completed"
          assert controlled.get("conclusion") == "success"

          required_jobs = {"guard-main", "build-assure-publish", "recovery", "bind-and-attest"}
          by_name = {job.get("name"): job for job in jobs}
          assert required_jobs <= set(by_name)
          assert all(by_name[name].get("conclusion") == "success" for name in required_jobs)

          required_artifacts = {
              f"controlled-build-{sha}",
              f"controlled-recovery-{sha}",
              f"controlled-candidate-{sha}",
          }
          artifact_by_name = {artifact.get("name"): artifact for artifact in artifacts}
          assert required_artifacts <= set(artifact_by_name)
          assert all(not artifact_by_name[name].get("expired") for name in required_artifacts)

          result = {
              "schema": "nexus.final_postmerge_workflow_result.v5",
              "status": "pass",
              "main_sha": sha,
              "canonical": {
                  key: canonical.get(key)
                  for key in ("id", "name", "event", "head_branch", "head_sha", "status", "conclusion", "html_url")
              },
              "controlled": {
                  key: controlled.get(key)
                  for key in ("id", "name", "event", "head_branch", "head_sha", "status", "conclusion", "html_url")
              },
              "controlled_jobs": {
                  name: {
                      "id": by_name[name].get("id"),
                      "status": by_name[name].get("status"),
                      "conclusion": by_name[name].get("conclusion"),
                  }
                  for name in sorted(required_jobs)
              },
              "artifacts": {
                  name: {
                      "id": artifact_by_name[name].get("id"),
                      "digest": artifact_by_name[name].get("digest"),
                      "size_in_bytes": artifact_by_name[name].get("size_in_bytes"),
                      "expired": artifact_by_name[name].get("expired"),
                  }
                  for name in sorted(required_artifacts)
              },
          }
          (out / "workflow-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify bounded observer evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(jq -r '.status' "$EVIDENCE_DIR/workflow-result.json")" = "pass"
          test "$(jq -r '.main_sha' "$EVIDENCE_DIR/workflow-result.json")" = "$MAIN_SHA"
          test "$(jq -r '.canonical.id' "$EVIDENCE_DIR/workflow-result.json")" = "$CANONICAL_RUN_ID"
          test "$(jq -r '.controlled.id' "$EVIDENCE_DIR/workflow-result.json")" = "$CONTROLLED_RUN_ID"

      - name: Upload final exact-main workflow observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-postmerge-observer-36ccc400-final
          path: artifacts/final-postmerge-observer/workflow-result.json
          retention-days: 14
          if-no-files-found: error
