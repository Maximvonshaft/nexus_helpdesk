name: GitHub Environment Inventory Probe

on:
  pull_request:
    types: [ready_for_review, synchronize]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: github-environment-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    if: >-
      github.event.pull_request.head.ref == 'ops/post-merge-production-evidence-fa7da390' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect protected environment metadata
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/nexus-environment-inventory
          status=pass
          if ! gh api "/repos/${REPO}/environments?per_page=100" > /tmp/nexus-environment-inventory/environments.json 2>/tmp/nexus-environment-inventory/environments.err; then
            status=api_denied
            printf '{"environments":[]}\n' > /tmp/nexus-environment-inventory/environments.json
          fi
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse
          from pathlib import Path
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          payload = json.loads(Path('/tmp/nexus-environment-inventory/environments.json').read_text())
          envs = payload.get('environments') or []
          pattern = re.compile(r'(SSH|DEPLOY|HOST|SERVER|CLOUDFLARE|TUNNEL|PROD|KEY|TOKEN)', re.I)
          output = []
          def api(path):
            proc = subprocess.run(
              ['gh','api',path], text=True, capture_output=True,
              env={**os.environ,'GH_TOKEN':token},
            )
            if proc.returncode != 0:
              return None, proc.stderr.strip().splitlines()[-1:] or ['denied']
            try:
              return json.loads(proc.stdout), []
            except Exception:
              return None, ['invalid_json']
          for env in envs:
            name = str(env.get('name') or '')
            encoded = urllib.parse.quote(name, safe='')
            secrets, secret_errors = api(f'/repos/{repo}/environments/{encoded}/secrets?per_page=100')
            variables, variable_errors = api(f'/repos/{repo}/environments/{encoded}/variables?per_page=100')
            secret_names = [str(x.get('name') or '') for x in (secrets or {}).get('secrets', [])]
            variable_names = [str(x.get('name') or '') for x in (variables or {}).get('variables', [])]
            output.append({
              'name': name,
              'protection_rules_count': len(env.get('protection_rules') or []),
              'deployment_branch_policy': bool(env.get('deployment_branch_policy')),
              'secret_count': len(secret_names),
              'variable_count': len(variable_names),
              'deployment_related_secret_count': sum(bool(pattern.search(x)) for x in secret_names),
              'deployment_related_variable_count': sum(bool(pattern.search(x)) for x in variable_names),
              'secret_metadata_access': not secret_errors,
              'variable_metadata_access': not variable_errors,
            })
          result = {
            'schema':'nexus.github-environment-inventory.v1',
            'status':'pass',
            'environment_count':len(output),
            'environments':output,
          }
          Path('/tmp/nexus-environment-inventory/summary.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Publish bounded environment inventory
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -c . /tmp/nexus-environment-inventory/summary.json 2>/dev/null || jq -nc '{schema:"nexus.github-environment-inventory.v1",status:"unavailable"}')"
          body=$(cat <<EOF
          ## GitHub environment inventory

          \`\`\`json
          ${payload}
          \`\`\`
          EOF
          )
          gh api --method POST "/repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
