name: I18N Catalog Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - webapp/**
      - scripts/i18n/bootstrap_operator_catalogs.py
      - scripts/i18n/bootstrap_operator_catalogs_v2.py
      - scripts/i18n/bootstrap_operator_catalogs_v3.py
      - .github/workflows/i18n-catalog-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap-catalogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build exact localization inventory
        working-directory: webapp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node scripts/assert-i18n-inventory.mjs

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned CPU translation toolchain
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.57.6' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'

      - name: Bootstrap English and German catalogs
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/i18n/bootstrap_operator_catalogs_v3.py \
            --inventory frontend_dist/i18n-inventory.json \
            --output /tmp/nexus-i18n-catalog-bootstrap \
            --batch-size 48

      - name: Upload review-only catalog evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i18n-catalog-bootstrap-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/nexus-i18n-catalog-bootstrap
