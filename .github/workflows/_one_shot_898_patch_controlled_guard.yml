name: one-shot-898-patch-controlled-guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/898-controlled-convergence-trigger-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/898-controlled-convergence-trigger-guard
          fetch-depth: 0
          persist-credentials: true

      - name: Patch workflow contract regression idempotently
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/release/tests/test_controlled_candidate_workflow_contract.py')
          text = path.read_text(encoding='utf-8')
          retired = "            \"github.event.workflow_run.head_branch == 'main'\",\n"
          text = text.replace(retired, '')

          method = """    def test_guard_runs_for_successful_push_and_checks_main_inside_job(self) -> None:
        guard = WORKFLOW[
            WORKFLOW.index("  guard-main:") : WORKFLOW.index("  build-assure-publish:")
        ]
        job_if = guard[
            guard.index("    if: >-") : guard.index("    permissions:")
        ]
        self.assertIn(
            "github.event.workflow_run.conclusion == 'success'",
            job_if,
        )
        self.assertIn("github.event.workflow_run.event == 'push'", job_if)
        self.assertNotIn("github.event.workflow_run.head_branch", job_if)
        self.assertIn('test "$TRIGGER_BRANCH" = "main"', guard)
        self.assertIn(
            'test "$(git rev-parse origin/main)" = "$SOURCE_SHA"',
            guard,
        )

"""
          if 'def test_guard_runs_for_successful_push_and_checks_main_inside_job' not in text:
              anchor = '    def test_actions_are_pinned_and_permissions_are_job_scoped(self) -> None:\n'
              if text.count(anchor) != 1:
                  raise SystemExit('contract test anchor did not match exactly once')
              text = text.replace(anchor, method + anchor)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit contract regression when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- scripts/release/tests/test_controlled_candidate_workflow_contract.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release/tests/test_controlled_candidate_workflow_contract.py
          git commit -m "test: cover executable controlled convergence guard"
          git push origin HEAD:fix/898-controlled-convergence-trigger-guard
