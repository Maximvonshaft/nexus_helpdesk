name: one-shot-912-apply-authorized-scope-fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/909-final-main-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: fix/898-authorized-scope-continuity
      EXPECTED_BASE_SHA: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/898-authorized-scope-continuity
          fetch-depth: 0
          persist-credentials: true

      - name: Require expected remediation baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE_SHA"
          test -f scripts/_apply_898_authorized_scope_continuity.py
          test -f scripts/_correct_898_authorized_scope_continuity.py
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked backend verification dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Apply corrected root-cause patch and run focused verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/_apply_898_authorized_scope_continuity.py
          python scripts/_correct_898_authorized_scope_continuity.py
          node --check backend/app/static/webchat/widget.js
          python -m compileall -q backend/app backend/tests scripts/release
          python -m pytest -q \
            backend/tests/test_webchat_public_tenant_binding.py \
            backend/tests/test_webchat_ws_static_contracts.py \
            backend/tests/test_webchat_voice_api.py \
            backend/tests/test_webchat_round_b.py
          git diff --check
          grep -F "rememberPublicSession(data)" backend/app/static/webchat/widget.js >/dev/null
          git rm \
            scripts/_apply_898_authorized_scope_continuity.py \
            scripts/_correct_898_authorized_scope_continuity.py

      - name: Commit only final product and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          allowed='^(backend/app/api/webchat_public.py|backend/app/services/webchat_message_service.py|backend/app/services/webchat_rate_limit.py|backend/app/services/webchat_service.py|backend/app/services/webchat_tenant_binding.py|backend/app/services/voice_session_service.py|backend/tests/test_webchat_public_tenant_binding.py|scripts/_apply_898_authorized_scope_continuity.py|scripts/_correct_898_authorized_scope_continuity.py)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "unexpected remediation paths:"; echo "$unexpected"; exit 2; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E '^\.github/workflows/' || true)"
          git commit -m "fix(webchat): preserve authorized scope without browser Origin"
          git push origin "HEAD:${TARGET_BRANCH}"
