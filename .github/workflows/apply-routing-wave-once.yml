name: Apply Routing Wave Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/maintenance/apply_routing_wave_once.py
      - .github/workflows/apply-routing-wave-once.yml
  push:
    branches:
      - feat/whatsapp-dual-transport-production-final
    paths:
      - scripts/maintenance/apply_routing_wave_once.py
      - .github/workflows/apply-routing-wave-once.yml

concurrency:
  group: apply-routing-wave-once
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact routing branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXACT_HEAD }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply exact fail-closed patch and create local verification commit
        shell: bash
        run: |
          exec > >(tee /tmp/routing-wave-once.log) 2>&1
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/maintenance/apply_routing_wave_once.py")
          text = path.read_text(encoding="utf-8")
          old = "backend/tests/test_audit_838_r5_handoff_authority.py"
          new = "backend/tests/test_control_tower_contract.py"
          if text.count(old) != 2:
              raise SystemExit("routing_patch_focus_anchor_invalid")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python scripts/maintenance/apply_routing_wave_once.py
          rm -f \
            .github/workflows/apply-routing-wave-once.yml \
            scripts/maintenance/apply_routing_wave_once.py \
            artifacts/routing-wave-once-failure.txt
          git diff --check
          git config user.name "nexus-routing-verifier"
          git config user.email "nexus-routing-verifier@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-routing-wave-once.yml \
            scripts/maintenance/apply_routing_wave_once.py \
            artifacts/routing-wave-once-failure.txt
          git add \
            .github/workflows/canonical-acceptance.yml \
            backend \
            deploy
          git diff --cached --check
          git commit -m "verification: scenario-governed handoff routing"
          verified_head="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          printf 'VERIFIED_HEAD=%s\n' "$verified_head" >> "$GITHUB_ENV"
      - name: Verify routing authority and repository contracts
        shell: bash
        env:
          PYTHONPATH: backend
          APP_ENV: test
          AUTO_INIT_DB: 'false'
          SEED_DEMO_DATA: 'false'
          ALLOW_DEV_AUTH: 'false'
        run: |
          exec > >(tee -a /tmp/routing-wave-once.log) 2>&1
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          test -z "$(git status --porcelain)"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend/app backend/tests scripts/release
          python scripts/verify_repository.py --static-only \
            --expected-sha "$VERIFIED_HEAD" \
            --evidence-out /tmp/routing-wave-static.json
          python -m pytest -q \
            backend/tests/test_audit_838_r5_case_scenario_authority.py \
            backend/tests/test_audit_838_r5_handoff_authority.py \
            backend/tests/test_audit_838_r6_scenario_routing.py \
            backend/tests/test_agent_routing_scope_fifo.py \
            backend/tests/test_conversation_first_agent_routing.py \
            backend/tests/test_conversation_first_agent_routing_residuals.py \
            backend/tests/test_webchat_handoff_control.py \
            backend/tests/test_operator_queue_current_scopes.py \
            backend/tests/test_production_readiness_convergence.py \
            backend/tests/test_repository_contract_suites.py
          python -m pytest -q scripts/release/tests/test_controlled_image_assurance_order.py
      - name: Package bounded convergence workspace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/routing-wave-evidence
          mkdir -p "$root/files"
          cp /tmp/routing-wave-once.log "$root/routing-wave-once.log" 2>/dev/null || true
          cp /tmp/routing-wave-static.json "$root/routing-wave-static.json" 2>/dev/null || true
          printf '%s\n' "$EXACT_HEAD" > "$root/base-commit-sha.txt"
          git rev-parse "$EXACT_HEAD^{tree}" > "$root/base-tree-sha.txt"
          verified_head="${VERIFIED_HEAD:-$(git rev-parse HEAD)}"
          printf '%s\n' "$verified_head" > "$root/verified-commit-sha.txt"
          git diff --binary "$EXACT_HEAD..$verified_head" -- \
            .github/workflows/canonical-acceptance.yml backend deploy \
            > "$root/product.patch"
          git diff --name-only --diff-filter=ACMRT "$EXACT_HEAD..$verified_head" -- \
            .github/workflows/canonical-acceptance.yml backend deploy \
            | sort -u > "$root/product-files.txt"
          git diff --name-only --diff-filter=D "$EXACT_HEAD..$verified_head" -- \
            .github/workflows/canonical-acceptance.yml backend deploy \
            | sort -u > "$root/product-deleted-files.txt"
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "$root/files/$(dirname "$path")"
            git show "$verified_head:$path" > "$root/files/$path"
          done < "$root/product-files.txt"
          {
            printf 'exact_head=%s\n' "$EXACT_HEAD"
            printf 'verified_head=%s\n' "$verified_head"
            printf 'product_file_count=%s\n' "$(wc -l < "$root/product-files.txt")"
            printf 'product_deleted_count=%s\n' "$(wc -l < "$root/product-deleted-files.txt")"
          } > "$root/manifest.txt"
      - name: Upload convergence workspace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routing-wave-workspace-${{ env.EXACT_HEAD }}
          path: /tmp/routing-wave-evidence
          if-no-files-found: error
          retention-days: 14
