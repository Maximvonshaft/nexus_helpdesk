name: one-shot-903-remove-review-overreach

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  converge:
    if: github.head_ref == 'fix/898-webchat-recovery-and-gates' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove ungrounded governance implementation and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- \
            .github/workflows/canonical-acceptance.yml \
            backend/tests/test_delivery_workflow_governance.py
          rm -f .github/workflows/_one_shot_903_remove_review_overreach.yml

          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2
          ! grep -R --fixed-strings 'review-governance:' .github/workflows backend/tests/test_delivery_workflow_governance.py
          ! grep -R --fixed-strings 'pull_request_review:' .github/workflows/canonical-acceptance.yml
          node --check backend/app/static/webchat/widget.js
          python -m compileall -q backend/tests
          git diff --check

      - name: Commit converged final scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove ungrounded review-gate overreach"
          git push origin HEAD:fix/898-webchat-recovery-and-gates
