name: one-shot-903-rc-scope

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  converge:
    if: github.head_ref == 'fix/898-webchat-recovery-and-gates' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind RC browser execution to Controlled Candidate only
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          canonical = Path('.github/workflows/canonical-acceptance.yml')
          text = canonical.read_text(encoding='utf-8')
          env_block = '''        env:
          RC_RUN_BROWSER_SMOKE: "true"
'''
          if text.count(env_block) != 1:
              raise SystemExit(f'expected one Canonical RC env block, found {text.count(env_block)}')
          canonical.write_text(text.replace(env_block, '', 1), encoding='utf-8')

          test_path = Path('backend/tests/test_delivery_workflow_governance.py')
          test_text = test_path.read_text(encoding='utf-8')
          constant = 'CONTROLLED_CANDIDATE_WORKFLOW = ROOT / ".github" / "workflows" / "controlled-candidate-convergence.yml"\n'
          anchor = 'CANONICAL_WORKFLOW = ROOT / ".github" / "workflows" / "canonical-acceptance.yml"\n'
          if constant not in test_text:
              if test_text.count(anchor) != 1:
                  raise SystemExit('canonical workflow constant anchor mismatch')
              test_text = test_text.replace(anchor, anchor + constant, 1)
          test_name = 'test_rc_live_browser_journey_is_owned_by_controlled_candidate_only'
          if test_name not in test_text:
              test_text += '''


def test_rc_live_browser_journey_is_owned_by_controlled_candidate_only():
    canonical = CANONICAL_WORKFLOW.read_text(encoding="utf-8")
    controlled = CONTROLLED_CANDIDATE_WORKFLOW.read_text(encoding="utf-8")

    assert 'RC_RUN_BROWSER_SMOKE: "true"' not in canonical
    assert "npm run e2e" in canonical
    assert 'RC_RUN_BROWSER_SMOKE: "true"' in controlled
    assert "workflow_run:" in controlled
'''
          test_path.write_text(test_text, encoding='utf-8')
          PY

          cp .github/workflows/canonical-acceptance.yml scripts/_canonical_903_rc_scope.yml
          git checkout HEAD -- .github/workflows/canonical-acceptance.yml
          git checkout HEAD -- .github/workflows/_one_shot_903_rc_scope.yml

          python -m compileall -q backend/tests
          python -m pytest -q backend/tests/test_delivery_workflow_governance.py
          git diff --check
          grep -q '^          RC_RUN_BROWSER_SMOKE: "true"$' .github/workflows/canonical-acceptance.yml
          ! grep -q '^          RC_RUN_BROWSER_SMOKE: "true"$' scripts/_canonical_903_rc_scope.yml
          test -s scripts/_canonical_903_rc_scope.yml

      - name: Commit grounded RC scope changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(webchat): bind live RC journey to controlled candidate"
          git push origin HEAD:fix/898-webchat-recovery-and-gates
