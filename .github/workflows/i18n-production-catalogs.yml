name: I18N Production Catalogs EN DE CNR

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/i18n/build_contextual_catalogs_v2.py
      - scripts/i18n/contextual_catalog_contract_v2.py
      - scripts/i18n/contextual_catalog_generation_v2.py
      - scripts/i18n/contextual_catalog_prepare_v2.py
      - scripts/i18n/contextual_catalog_finalize_v2.py
      - scripts/i18n/operator_catalog_overrides_v1.json
      - .github/workflows/i18n-production-catalogs.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: i18n-production-catalogs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRODUCT_INVENTORY_HEAD_SHA: 7b11a78afa30e54832ed0e8f43ac1a59db8ff224
  PREPARATION_ARTIFACT: i18n-contextual-preparation-7b11a78afa30e54832ed0e8f43ac1a59db8ff224

jobs:
  prepare-exact-product-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tooling candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compile contextual catalog tooling
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/i18n/build_contextual_catalogs_v2.py \
            scripts/i18n/contextual_catalog_contract_v2.py \
            scripts/i18n/contextual_catalog_generation_v2.py \
            scripts/i18n/contextual_catalog_prepare_v2.py \
            scripts/i18n/contextual_catalog_finalize_v2.py

      - name: Checkout exact product inventory candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.PRODUCT_INVENTORY_HEAD_SHA }}
          path: product-candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact product source head
        run: |
          set -Eeuo pipefail
          test "$(git -C product-candidate rev-parse HEAD)" = "$PRODUCT_INVENTORY_HEAD_SHA"
          test -z "$(git -C product-candidate status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product-candidate/webapp/package-lock.json

      - name: Build exact product localization inventory
        working-directory: product-candidate/webapp
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node scripts/assert-i18n-inventory.mjs

      - name: Prepare contextual generation authority
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/nexus-i18n-preparation
          python scripts/i18n/build_contextual_catalogs_v2.py prepare \
            --inventory product-candidate/frontend_dist/i18n-inventory.json \
            --base-overrides scripts/i18n/operator_catalog_overrides_v1.json \
            --critical-contract product-candidate/webapp/design/i18n-critical-catalog.v1.json \
            --output /tmp/nexus-i18n-preparation \
            --product-head "$PRODUCT_INVENTORY_HEAD_SHA"

      - name: Upload immutable preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PREPARATION_ARTIFACT }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/nexus-i18n-preparation

  generate-contextual-locale:
    needs: prepare-exact-product-inventory
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        locale: [en, de, cnr]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact tooling candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact preparation authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PREPARATION_ARTIFACT }}
          path: /tmp/nexus-i18n-preparation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned CPU contextual inference toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.57.6' 'accelerate==1.9.0' 'safetensors==0.8.0'

      - name: Generate and repair ${{ matrix.locale }} catalog
        id: generate
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -uo pipefail
          output="/tmp/nexus-i18n-generation-${{ matrix.locale }}"
          rm -rf "$output"
          mkdir -p "$output"
          set +e
          python scripts/i18n/build_contextual_catalogs_v2.py generate \
            --locale '${{ matrix.locale }}' \
            --input "/tmp/nexus-i18n-preparation/generation-input-${{ matrix.locale }}.json" \
            --output "$output" \
            --batch-items 12 \
            --max-new-tokens 320 \
            --review-passes 1 \
            2>&1 | tee "$output/generation.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf '{"schema":"nexus.i18n-contextual-generation-result.v2","locale":"%s","status":%s,"tooling_head_sha":"%s","product_inventory_head_sha":"%s"}\n' \
            '${{ matrix.locale }}' "$status" '${{ github.event.pull_request.head.sha }}' "$PRODUCT_INVENTORY_HEAD_SHA" \
            > "$output/generation-result.json"
          exit 0

      - name: Upload immutable locale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i18n-contextual-locale-${{ matrix.locale }}-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/nexus-i18n-generation-${{ matrix.locale }}

      - name: Enforce locale generation result
        if: always() && steps.generate.outputs.status != '0'
        run: |
          echo 'Contextual locale generation failed; inspect the immutable locale artifact.' >&2
          exit 1

  finalize-and-publish:
    needs: [prepare-exact-product-inventory, generate-contextual-locale]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tooling candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact preparation authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PREPARATION_ARTIFACT }}
          path: /tmp/nexus-i18n-preparation

      - name: Download generated locale evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: i18n-contextual-locale-*-${{ github.event.pull_request.head.sha }}
          path: /tmp/nexus-i18n-generated
          merge-multiple: true

      - name: Finalize exact catalogs and evidence
        id: finalize
        run: |
          set -uo pipefail
          rm -rf /tmp/nexus-i18n-production-v2
          mkdir -p /tmp/nexus-i18n-production-v2
          set +e
          python scripts/i18n/build_contextual_catalogs_v2.py finalize \
            --inventory /tmp/nexus-i18n-preparation/i18n-inventory.json \
            --base-overrides scripts/i18n/operator_catalog_overrides_v1.json \
            --critical-contract /tmp/nexus-i18n-preparation/i18n-critical-catalog.v1.json \
            --preparation-metadata /tmp/nexus-i18n-preparation/preparation-metadata.json \
            --generated-dir /tmp/nexus-i18n-generated \
            --output /tmp/nexus-i18n-production-v2 \
            --product-head "$PRODUCT_INVENTORY_HEAD_SHA" \
            2>&1 | tee /tmp/nexus-i18n-production-v2/finalization.log
          status=${PIPESTATUS[0]}
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf '{"schema":"nexus.i18n-contextual-finalization-result.v2","status":%s,"tooling_head_sha":"%s","product_inventory_head_sha":"%s"}\n' \
            "$status" '${{ github.event.pull_request.head.sha }}' "$PRODUCT_INVENTORY_HEAD_SHA" \
            > /tmp/nexus-i18n-production-v2/finalization-result.json
          exit 0

      - name: Upload immutable final catalog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i18n-production-contextual-catalogs-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/nexus-i18n-production-v2

      - name: Enforce final catalog result
        if: always() && steps.finalize.outputs.status != '0'
        run: |
          echo 'Contextual catalog finalization failed; inspect the immutable final artifact.' >&2
          exit 1

      - name: Publish validated catalogs to output branch
        if: steps.finalize.outputs.status == '0'
        env:
          OUTPUT_BRANCH: tooling/i18n-catalog-output
        run: |
          set -Eeuo pipefail
          git config user.name 'nexus-i18n-catalog-bot'
          git config user.email 'nexus-i18n-catalog-bot@users.noreply.github.com'
          git fetch origin "$OUTPUT_BRANCH"
          git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH"
          mkdir -p catalogs/operator-ui
          cp /tmp/nexus-i18n-production-v2/catalog-en.review.json catalogs/operator-ui/en.json
          cp /tmp/nexus-i18n-production-v2/catalog-de.review.json catalogs/operator-ui/de.json
          cp /tmp/nexus-i18n-production-v2/catalog-cnr.review.json catalogs/operator-ui/cnr.json
          cp /tmp/nexus-i18n-production-v2/source-en.review.json catalogs/operator-ui/source-en.review.json
          cp /tmp/nexus-i18n-production-v2/source-de.review.json catalogs/operator-ui/source-de.review.json
          cp /tmp/nexus-i18n-production-v2/source-cnr.review.json catalogs/operator-ui/source-cnr.review.json
          cp /tmp/nexus-i18n-production-v2/production-catalog-metadata.json catalogs/operator-ui/production-catalog-metadata.json
          cp /tmp/nexus-i18n-production-v2/validation-report.json catalogs/operator-ui/validation-report.json
          git add catalogs/operator-ui
          if git diff --cached --quiet; then
            echo 'Validated contextual catalog output is already current.'
            exit 0
          fi
          git commit -m 'tooling(i18n): publish contextual en de cnr catalogs'
          git push origin "HEAD:$OUTPUT_BRANCH"
