name: one-shot-898-apply-transport-fix

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/898-rc-failure-log'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/898-webchat-transport-authority
          fetch-depth: 0
          persist-credentials: true

      - name: Execute staged root-cause patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/_one_shot_898_transport_authority.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          node --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          extracted = []
          for line in lines:
              if line.startswith('          '):
                  extracted.append(line[10:])
              elif line:
                  raise SystemExit(f'unexpected patch indentation: {line!r}')
              else:
                  extracted.append('')
          Path('/tmp/apply_transport_fix.py').write_text('\n'.join(extracted) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_transport_fix.py
          node --check backend/app/static/webchat/widget.js
          python -m compileall -q backend/tests scripts/release
          python -m unittest -v scripts.release.tests.test_capture_controlled_rc_failure
          python -m pytest -q backend/tests/test_webchat_ws_static_contracts.py
          git diff --check
          ! grep -F "recoverLegacySession(session).catch" backend/app/static/webchat/widget.js

      - name: Commit only final product and test changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/app/static/webchat/widget.js \
            backend/app/static/webchat/demo/index.html \
            backend/tests/test_webchat_ws_static_contracts.py \
            webapp/e2e/webchat-realtime-fallback.spec.ts \
            scripts/release/capture_controlled_rc_failure.py \
            scripts/release/tests/test_capture_controlled_rc_failure.py
          git commit -m "fix(webchat): keep HTTP session authoritative on realtime failure"
          git push origin HEAD:fix/898-webchat-transport-authority
