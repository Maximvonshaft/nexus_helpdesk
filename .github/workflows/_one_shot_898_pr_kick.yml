name: one-shot-898-pr-kick

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  kick:
    if: github.head_ref == 'fix/898-webchat-recovery-and-gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute staged remediation and remove all temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/_one_shot_898_remediation.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply coherent root-cause remediation\n        shell: bash\n        run: |\n'
          end_marker = '\n      - name: Commit final tree without executor residue\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          extracted = []
          for line in lines:
              if line.startswith('          '):
                  extracted.append(line[10:])
              elif line:
                  raise SystemExit(f'unexpected staged script indentation: {line!r}')
              else:
                  extracted.append('')
          Path('/tmp/apply-898.sh').write_text('\n'.join(extracted) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-898.sh
          rm -f .github/workflows/_one_shot_898_pr_kick.yml
          test ! -e .github/workflows/_one_shot_898_remediation.yml
          test ! -e .github/workflows/_one_shot_898_pr_kick.yml

      - name: Commit final remediation tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(webchat): coordinate recovery and close acceptance gaps"
          git push origin HEAD:fix/898-webchat-recovery-and-gates
