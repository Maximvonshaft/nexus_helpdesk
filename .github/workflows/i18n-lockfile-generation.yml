name: I18N Lockfile Generation

on:
  push:
    branches:
      - tooling/i18n-lockfile-generation
  pull_request:
    branches:
      - main
    paths:
      - webapp/package.json
      - webapp/package-lock.json
      - .github/workflows/i18n-lockfile-generation.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Generate deterministic lockfile
        working-directory: webapp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify exact lockfile installation
        working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture package contracts
        working-directory: webapp
        run: |
          npm view i18next@26.3.6 version dependencies peerDependencies engines --json > i18next-contract.json
          npm view react-i18next@17.0.11 version dependencies peerDependencies engines --json > react-i18next-contract.json

      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i18n-lockfile-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            webapp/package.json
            webapp/package-lock.json
            webapp/i18next-contract.json
            webapp/react-i18next-contract.json
