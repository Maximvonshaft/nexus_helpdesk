name: Local Browser Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/local-source-export.yml

permissions:
  contents: read

jobs:
  export-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install exact frontend dependency lock
        working-directory: webapp
        run: npm ci

      - name: Install Playwright Firefox runtime
        working-directory: webapp
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
        run: npx playwright install firefox

      - name: Record browser identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ github.event.pull_request.base.sha }}" > BASE_SOURCE_COMMIT.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > EXPORT_HEAD_COMMIT.txt
          find playwright-browsers -maxdepth 3 -type f -name firefox -o -name firefox-bin | sort > PLAYWRIGHT_FIREFOX_FILES.txt
          tar -czf nexus-playwright-firefox-1.61.1.tgz playwright-browsers
          sha256sum nexus-playwright-firefox-1.61.1.tgz > PLAYWRIGHT_FIREFOX_SHA256SUMS.txt

      - name: Upload browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: nexus-playwright-firefox-1.61.1
          path: |
            nexus-playwright-firefox-1.61.1.tgz
            PLAYWRIGHT_FIREFOX_FILES.txt
            PLAYWRIGHT_FIREFOX_SHA256SUMS.txt
            BASE_SOURCE_COMMIT.txt
            EXPORT_HEAD_COMMIT.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
