name: one-shot-912-controlled-rc-preacceptance

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  controlled-rc:
    if: github.head_ref == 'audit/909-final-main-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_SHA: 5ae7e60af637b917fa750c66c9f1b7d18ac4ef39
      SOURCE_SHA: 5ae7e60af637b917fa750c66c9f1b7d18ac4ef39
      RC_SOURCE_SHA: 5ae7e60af637b917fa750c66c9f1b7d18ac4ef39
      RC_ENV_FILE: deploy/.env.rc-test
      RC_EVIDENCE_DIR: artifacts/rc-test
      RC_RUN_BROWSER_SMOKE: "true"
      RC_BASE_URL: http://127.0.0.1:18083
      RC_PUBLIC_ORIGIN: http://127.0.0.1:18083
      COMPOSE_PROJECT_NAME: nexus_pr912_rc_${{ github.run_id }}
      CANDIDATE_IMAGE: nexusdesk/helpdesk:pr912-rc-5ae7e60a
      RC_POSTGRES_IMAGE_PIN: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
      RC_NGINX_IMAGE_PIN: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 5ae7e60af637b917fa750c66c9f1b7d18ac4ef39
          fetch-depth: 0
          persist-credentials: false

      - name: Require frozen PR head and current main relation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main fix/898-authorized-scope-continuity
          test "$(git rev-parse origin/fix/898-authorized-scope-continuity)" = "$TARGET_SHA"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install locked browser dependencies
        working-directory: webapp
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute exact one-build Controlled RC chain
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/release/run_controlled_rc_gate.sh
          test "$(jq -r '.decision' artifacts/rc-test/candidate-manifest.json)" = "RC0_TEST_DEPLOYABLE"
          test "$(jq -r '.candidate.source_sha' artifacts/rc-test/candidate-manifest.json)" = "$TARGET_SHA"

      - name: Upload scanned RC evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr912-controlled-rc-5ae7e60a-${{ github.run_attempt }}
          path: artifacts/rc-test
          retention-days: 3
          if-no-files-found: warn
