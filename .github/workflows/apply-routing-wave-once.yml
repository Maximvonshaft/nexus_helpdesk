name: Apply Routing Wave Once

on:
  push:
    branches:
      - feat/whatsapp-dual-transport-production-final
    paths:
      - scripts/maintenance/apply_routing_wave_once.py
      - .github/workflows/apply-routing-wave-once.yml

concurrency:
  group: apply-routing-wave-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact routing branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/whatsapp-dual-transport-production-final
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply exact fail-closed patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "feat/whatsapp-dual-transport-production-final"
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/maintenance/apply_routing_wave_once.py")
          text = path.read_text(encoding="utf-8")
          old = "backend/tests/test_audit_838_r5_handoff_authority.py"
          new = "backend/tests/test_control_tower_contract.py"
          if text.count(old) != 2:
              raise SystemExit("routing_patch_focus_anchor_invalid")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python scripts/maintenance/apply_routing_wave_once.py
          git checkout -- scripts/maintenance/apply_routing_wave_once.py
          git diff --check
      - name: Verify routing authority and repository contracts
        shell: bash
        env:
          PYTHONPATH: backend
          APP_ENV: test
          AUTO_INIT_DB: 'false'
          SEED_DEMO_DATA: 'false'
          ALLOW_DEV_AUTH: 'false'
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend/app backend/tests scripts/release
          python -m pytest -q \
            backend/tests/test_audit_838_r5_case_scenario_authority.py \
            backend/tests/test_audit_838_r5_handoff_authority.py \
            backend/tests/test_audit_838_r6_scenario_routing.py \
            backend/tests/test_agent_routing_scope_fifo.py \
            backend/tests/test_conversation_first_agent_routing.py \
            backend/tests/test_conversation_first_agent_routing_residuals.py \
            backend/tests/test_webchat_handoff_control.py \
            backend/tests/test_operator_queue_current_scopes.py \
            backend/tests/test_production_readiness_convergence.py \
            backend/tests/test_repository_contract_suites.py
          python -m pytest -q scripts/release/tests/test_controlled_image_assurance_order.py
      - name: Commit only converged product files
        shell: bash
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          git checkout -- .github/workflows/apply-routing-wave-once.yml
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "nexus-routing-convergence"
          git config user.email "nexus-routing-convergence@users.noreply.github.com"
          git add \
            .github/workflows/canonical-acceptance.yml \
            backend \
            deploy
          git diff --cached --check
          git commit -m "feat(routing): converge scenario-governed handoff authority"
          git push origin HEAD:feat/whatsapp-dual-transport-production-final
