name: Canonical Acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: canonical-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PYTHONPATH: backend
  APP_ENV: test
  AUTO_INIT_DB: "false"
  SEED_DEMO_DATA: "false"
  ALLOW_DEV_AUTH: "false"
  PROVIDER_RUNTIME_ENABLED: "false"
  PROVIDER_RUNTIME_TRAFFIC_MODE: control
  PROVIDER_RUNTIME_KILL_SWITCH: "true"
  PROVIDER_RUNTIME_CANARY_PERCENT: "0"
  PRIVATE_AI_RUNTIME_ENABLED: "false"
  WEBCHAT_AI_ENABLED: "false"
  WEBCHAT_AI_AUTO_REPLY_MODE: off
  WEBCHAT_HUMAN_CALL_ENABLED: "false"
  WEBCHAT_LIVE_AI_VOICE_ENABLED: "false"
  ENABLE_OUTBOUND_DISPATCH: "false"
  OUTBOUND_PROVIDER: disabled
  WHATSAPP_ENABLED: "false"
  WHATSAPP_EMBEDDED_SIGNUP_ENABLED: "false"
  WHATSAPP_MEDIA_ENABLED: "false"
  WHATSAPP_MEDIA_SCANNER: disabled
  EMAIL_MAILBOX_SYNC_ENABLED: "false"
  SPEEDAF_MCP_ENABLED: "false"
  SPEEDAF_TRACK_QUERY_ENABLED: "false"
  SPEEDAF_WORK_ORDER_CREATE_ENABLED: "false"
  SPEEDAF_UPDATE_ADDRESS_ENABLED: "false"
  SPEEDAF_CANCEL_ENABLED: "false"
  SPEEDAF_VOICE_CALLBACK_ENABLED: "false"
  OPERATIONS_DISPATCH_MODE: disabled
  OPERATIONS_DISPATCH_ADAPTER: disabled

jobs:
  validation-mode:
    name: validation-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      run_full: ${{ steps.resolve.outputs.run_full }}
    steps:
      - name: Resolve fail-closed validation mode
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          mode=""
          run_full="false"
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              if [[ "$PR_ACTION" = "converted_to_draft" || "$PR_DRAFT" = "true" ]]; then
                mode="development"
                run_full="false"
              else
                mode="candidate"
                run_full="true"
              fi
              ;;
            push)
              test "$REF_NAME" = "main"
              mode="main"
              run_full="true"
              ;;
            workflow_dispatch)
              if [[ "$REF_NAME" = "main" ]]; then
                mode="main"
              else
                mode="candidate"
              fi
              run_full="true"
              ;;
            *)
              echo "unsupported canonical event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          case "$mode" in
            development|candidate|main) ;;
            *) exit 2 ;;
          esac
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'run_full=%s\n' "$run_full" >> "$GITHUB_OUTPUT"

  candidate-identity:
    name: candidate-identity
    needs: validation-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tree_sha: ${{ steps.identity.outputs.tree_sha }}
    steps:
      - name: Checkout exact event Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact identity and current-main relation
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.validation-mode.outputs.mode }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$source_sha" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          behind=0
          ahead=0
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_SHA"
            behind="$(git rev-list --count "$source_sha..$BASE_SHA")"
            ahead="$(git rev-list --count "$BASE_SHA..$source_sha")"
            if [[ "$MODE" != "development" ]]; then
              test "$behind" = "0"
            fi
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tree_sha=%s\n' "$tree_sha" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg source_sha "$source_sha" \
            --arg tree_sha "$tree_sha" \
            --arg base_sha "$BASE_SHA" \
            --arg mode "$MODE" \
            --argjson ahead "$ahead" \
            --argjson behind "$behind" \
            '{schema:"nexus.actions-candidate-identity.v2",source_sha:$source_sha,tree_sha:$tree_sha,base_sha:$base_sha,mode:$mode,ahead:$ahead,behind:$behind,clean:true}' \
            > /tmp/candidate-identity.json
      - name: Upload candidate identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-identity-${{ steps.identity.outputs.source_sha }}
          path: /tmp/candidate-identity.json
          if-no-files-found: error
          retention-days: 30

  review-governance:
    name: review-governance
    if: >-
      needs.validation-mode.outputs.mode == 'candidate' &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    needs: [validation-mode, candidate-identity]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact-Head independent approval and zero unresolved threads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXPECTED_HEAD: ${{ needs.candidate-identity.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          pull="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.head.sha' <<<"$pull")" = "$EXPECTED_HEAD"
          test "$(jq -r '.draft' <<<"$pull")" = "false"
          reviews="$(gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews")"
          latest_reviews="$(jq -c --arg author "$PR_AUTHOR" '
            [
              .[][]
              | select(.user.login != $author)
              | select(
                  .state == "APPROVED"
                  or .state == "CHANGES_REQUESTED"
                  or .state == "DISMISSED"
                )
            ]
            | group_by(.user.login)
            | map(sort_by(.submitted_at) | last)
          ' <<<"$reviews")"
          test "$(jq --arg head "$EXPECTED_HEAD" '[.[] | select(.state == "APPROVED" and .commit_id == $head)] | length' <<<"$latest_reviews")" -ge 1
          test "$(jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length' <<<"$latest_reviews")" = "0"
          threads="$(gh api graphql --paginate --slurp \
            -f owner="$owner" \
            -f name="$name" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}')"
          test "$(jq '[.[] | .data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = "0"

  development-fast:
    name: development-fast
    if: needs.validation-mode.outputs.mode == 'development'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen development Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            config/security/security-tool-requirements.txt
      - name: Classify changed authority paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA...HEAD" | tee /tmp/development-changed-paths.txt
          python_changed=false
          frontend_changed=false
          sidecar_changed=false
          migration_changed=false
          while IFS= read -r path; do
            case "$path" in backend/*|scripts/*|config/*|deploy/*|.github/workflows/*) python_changed=true ;; esac
            case "$path" in webapp/*) frontend_changed=true ;; esac
            case "$path" in connectors/whatsapp-sidecar/*) sidecar_changed=true ;; esac
            case "$path" in backend/alembic/*|deploy/*|scripts/release/*|scripts/deploy/*) migration_changed=true ;; esac
          done < /tmp/development-changed-paths.txt
          printf 'python_changed=%s\n' "$python_changed" >> "$GITHUB_OUTPUT"
          printf 'frontend_changed=%s\n' "$frontend_changed" >> "$GITHUB_OUTPUT"
          printf 'sidecar_changed=%s\n' "$sidecar_changed" >> "$GITHUB_OUTPUT"
          printf 'migration_changed=%s\n' "$migration_changed" >> "$GITHUB_OUTPUT"
      - name: Install bounded Python verification dependencies
        if: steps.paths.outputs.python_changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check -r config/security/security-tool-requirements.txt
      - name: Verify focused backend and governance contracts
        if: steps.paths.outputs.python_changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/nexus-development
          python -m compileall -q backend/app backend/scripts scripts/qualification scripts/deploy scripts/release
          python scripts/security/scan_repository.py --root . --output /tmp/nexus-development/repository-secret-scan.json
          python scripts/verify_repository.py --static-only \
            --expected-sha "${{ needs.candidate-identity.outputs.source_sha }}" \
            --evidence-out /tmp/nexus-development/repository-static.json
          python -m pytest -q \
            backend/tests/test_admin_action_rate_limit.py \
            backend/tests/test_canonical_actions_image_contract.py \
            backend/tests/test_control_tower_contract.py \
            backend/tests/test_delivery_workflow_governance.py \
            backend/tests/test_operator_product_foundation.py \
            backend/tests/test_outbound_channel_capabilities.py \
            backend/tests/test_production_readiness_convergence.py \
            backend/tests/test_qa_training_contract.py \
            backend/tests/test_repository_contract_suites.py \
            backend/tests/test_webchat_voice_api.py \
            backend/tests/test_webchat_voice_p0_gap_closure.py \
            backend/tests/test_webchat_voice_room_compensation.py \
            2>&1 | tee /tmp/nexus-development/focused-backend.log
      - name: Prove one Alembic head
        if: steps.paths.outputs.migration_changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd backend
          mapfile -t heads < <(python -m alembic heads | awk 'NF {print $1}')
          test "${#heads[@]}" = "1"
          printf '%s\n' "${heads[0]}" | tee /tmp/development-alembic-head.txt
      - name: Set up Node for affected products
        if: steps.paths.outputs.frontend_changed == 'true' || steps.paths.outputs.sidecar_changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify frontend without browser
        if: steps.paths.outputs.frontend_changed == 'true'
        working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run verify
      - name: Verify Sidecar types tests and build
        if: steps.paths.outputs.sidecar_changed == 'true'
        working-directory: connectors/whatsapp-sidecar
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm test && npm run build
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-fast-${{ needs.candidate-identity.outputs.source_sha }}
          path: |
            /tmp/development-changed-paths.txt
            /tmp/development-alembic-head.txt
            /tmp/nexus-development
          if-no-files-found: warn
          retention-days: 14

  static-authority:
    name: static-authority
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run canonical static verifier
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          mkdir -p /tmp/nexus-static
          python scripts/verify_repository.py --static-only \
            --expected-sha "${{ needs.candidate-identity.outputs.source_sha }}" \
            --evidence-out /tmp/nexus-static/repository-static.json
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-authority-${{ needs.candidate-identity.outputs.source_sha }}
          path: /tmp/nexus-static
          if-no-files-found: error
          retention-days: 30

  backend-full:
    name: backend-full (${{ matrix.shard.name }})
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: 1-of-4
            index: 0
          - name: 2-of-4
            index: 1
          - name: 3-of-4
            index: 2
          - name: 4-of-4
            index: 3
    steps:
      - name: Checkout frozen Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run complete backend regression
        shell: bash
        env:
          BACKEND_SHARD_INDEX: ${{ matrix.shard.index }}
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend/app backend/scripts scripts/qualification scripts/deploy scripts/release
          mkdir -p /tmp/nexus-backend
          mapfile -t all_test_files < <(
            find backend/tests -maxdepth 1 -type f -name 'test_*.py' -print | sort
          )
          shard_test_files=()
          for index in "${!all_test_files[@]}"; do
            if (( index % 4 == BACKEND_SHARD_INDEX )); then
              shard_test_files+=("${all_test_files[$index]}")
            fi
          done
          test "${#shard_test_files[@]}" -gt 0
          printf '%s\n' "${shard_test_files[@]}" \
            > "/tmp/nexus-backend/shard-${BACKEND_SHARD_INDEX}-files.txt"
          python -m pytest -vv --maxfail=1 --durations=25 \
            "${shard_test_files[@]}" \
            2>&1 | tee "/tmp/nexus-backend/pytest-shard-${BACKEND_SHARD_INDEX}.log"
          if [[ "$BACKEND_SHARD_INDEX" = "0" ]]; then
            python -m pytest -vv --maxfail=1 \
              scripts/qualification/tests/test_whatsapp_live_uat.py \
              scripts/deploy/tests/test_validate_production_activation.py \
              scripts/release/tests/test_controlled_candidate_workflow_contract.py \
              2>&1 | tee /tmp/nexus-backend/whatsapp-delivery-contracts.log
          fi
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-evidence-${{ needs.candidate-identity.outputs.source_sha }}-${{ matrix.shard.name }}
          path: /tmp/nexus-backend
          if-no-files-found: warn
          retention-days: 30

  frontend-browser:
    name: frontend-browser
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout frozen Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Verify frontend and browser journeys
        working-directory: webapp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-evidence-${{ needs.candidate-identity.outputs.source_sha }}
          path: |
            webapp/playwright-report
            webapp/test-results
            frontend_dist
          if-no-files-found: warn
          retention-days: 30

  postgres-acceptance:
    name: postgres-acceptance
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: docker.io/pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: nexus_ci_acceptance
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: nexus_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_ci -d nexus_ci_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://nexus_ci:nexus_ci_only@127.0.0.1:5432/nexus_ci_acceptance
      JWT_SECRET_KEY: ci-only-not-a-production-secret-0123456789abcdef
      AI_REPLY_CONTRACT_SECRET: ci-only-contract-secret-0123456789abcdef
    steps:
      - name: Checkout frozen Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Rehearse migrations and PostgreSQL acceptance
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          mkdir -p /tmp/nexus-postgres
          cd backend
          python -m alembic upgrade head 2>&1 | tee /tmp/nexus-postgres/alembic-upgrade.log
          python -m alembic downgrade -1 2>&1 | tee /tmp/nexus-postgres/alembic-downgrade.log
          python -m alembic upgrade head 2>&1 | tee /tmp/nexus-postgres/alembic-reupgrade.log
          cd ..
          python scripts/qualification/postgres_acceptance.py \
            --evidence-dir /tmp/nexus-postgres \
            --source-sha "${{ needs.candidate-identity.outputs.source_sha }}" \
            --tree-sha "${{ needs.candidate-identity.outputs.tree_sha }}" \
            --output /tmp/nexus-postgres/postgres-acceptance-run.json
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-evidence-${{ needs.candidate-identity.outputs.source_sha }}
          path: /tmp/nexus-postgres
          if-no-files-found: error
          retention-days: 30

  sidecar-supply-chain:
    name: sidecar-supply-chain
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout frozen Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: connectors/whatsapp-sidecar/package-lock.json
      - name: Verify Sidecar and generate dependency SBOM
        working-directory: connectors/whatsapp-sidecar
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/nexus-sidecar
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
          npm sbom --sbom-format cyclonedx > /tmp/nexus-sidecar/sidecar.raw.cdx.json
          node -e 'JSON.parse(require("fs").readFileSync("/tmp/nexus-sidecar/sidecar.raw.cdx.json", "utf8"))'
      - name: Build Sidecar image
        env:
          SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          docker build --pull=false \
            --file connectors/whatsapp-sidecar/Dockerfile \
            --build-arg GIT_SHA="$SOURCE_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg APP_VERSION="pr-$SOURCE_SHA" \
            --tag "nexus-whatsapp-sidecar-ci:$SOURCE_SHA" \
            connectors/whatsapp-sidecar
          test "$(docker image inspect "nexus-whatsapp-sidecar-ci:$SOURCE_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "nexus-whatsapp-sidecar-ci:$SOURCE_SHA" --format '{{ .Config.User }}')" = "node"
          docker image inspect "nexus-whatsapp-sidecar-ci:$SOURCE_SHA" > /tmp/nexus-sidecar/image-inspect.json
      - name: Capture Sidecar image vulnerability evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nexus-whatsapp-sidecar-ci:${{ needs.candidate-identity.outputs.source_sha }}
          format: json
          output: /tmp/nexus-sidecar/sidecar-trivy.raw.json
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Block Sidecar high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nexus-whatsapp-sidecar-ci:${{ needs.candidate-identity.outputs.source_sha }}
          format: table
          output: /tmp/nexus-sidecar/trivy-gate.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Generate Sidecar image CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nexus-whatsapp-sidecar-ci:${{ needs.candidate-identity.outputs.source_sha }}
          format: cyclonedx
          output: /tmp/nexus-sidecar/sidecar-image.raw.cdx.json
          scanners: vuln
          ignore-unfixed: false
          exit-code: '0'
      - name: Upload Sidecar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sidecar-supply-chain-${{ needs.candidate-identity.outputs.source_sha }}
          path: /tmp/nexus-sidecar
          if-no-files-found: error
          retention-days: 30

  security-supply-chain:
    name: security-supply-chain
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout frozen Head with reachable history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            config/security/security-tool-requirements.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          languages: python,javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Run secret SAST and dependency assurance
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check -r config/security/security-tool-requirements.txt
          mkdir -p /tmp/nexus-security
          python scripts/security/scan_repository.py --root . --output /tmp/nexus-security/repository-secret-scan.json
          python scripts/security/scan_git_history.py --root . --max-blob-bytes 33554432 --output /tmp/nexus-security/history-secret-scan.json
          python -m bandit -r backend/app -ll -ii -f json -o /tmp/nexus-security/bandit.json
          python -m pip_audit -r backend/requirements.txt --strict --format json --output /tmp/nexus-security/python-dependencies.json
          cd webapp
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high --json > /tmp/nexus-security/frontend-dependencies.json
      - name: Analyze exact Head with CodeQL
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          upload: never
          upload-database: false
          output: /tmp/nexus-security/codeql
          category: canonical-security
      - name: Enforce zero CodeQL findings
        env:
          CODEQL_ALLOW_UNUSED_EXCEPTIONS: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: |
          set -Eeuo pipefail
          exception_args=()
          if [[ "$CODEQL_ALLOW_UNUSED_EXCEPTIONS" = "true" ]]; then
            exception_args+=(--allow-unused-exceptions)
          fi
          python scripts/security/assert_sarif_clean.py \
            --input /tmp/nexus-security/codeql \
            --exceptions config/security/codeql-exceptions.json \
            --output /tmp/nexus-security/codeql-summary.json \
            "${exception_args[@]}"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-evidence-${{ needs.candidate-identity.outputs.source_sha }}
          path: /tmp/nexus-security
          if-no-files-found: error
          retention-days: 30

  image-smoke:
    name: image-smoke
    if: needs.validation-mode.outputs.run_full == 'true'
    needs: [validation-mode, candidate-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: nexus_image_acceptance
          POSTGRES_USER: nexus_image
          POSTGRES_PASSWORD: nexus_image_only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_image -d nexus_image_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout frozen Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
      - name: Build exact-Head image
        env:
          SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
        run: |
          mkdir -p /tmp/nexus-image
          docker build --pull=false \
            --build-arg GIT_SHA="$SOURCE_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_TAG="nexus-ci:$SOURCE_SHA" \
            --build-arg APP_VERSION="pr-$SOURCE_SHA" \
            --build-arg FRONTEND_BUILD_SHA="$SOURCE_SHA" \
            --tag "nexus-ci:$SOURCE_SHA" . 2>&1 | tee /tmp/nexus-image/build.log
          test "$(docker image inspect "nexus-ci:$SOURCE_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          docker image inspect "nexus-ci:$SOURCE_SHA" > /tmp/nexus-image/image-inspect.json
      - name: Block image high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nexus-ci:${{ needs.candidate-identity.outputs.source_sha }}
          format: table
          output: /tmp/nexus-image/trivy-gate.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Migrate disposable image database
        env:
          SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
          DATABASE_URL: postgresql+psycopg://nexus_image:nexus_image_only@127.0.0.1:55432/nexus_image_acceptance
        run: |
          docker run --rm --network host \
            -e PYTHONPATH=/app/backend \
            -e APP_ENV=test \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET_KEY=ci-only-not-a-production-secret-0123456789abcdef \
            -e AI_REPLY_CONTRACT_SECRET=ci-only-contract-secret-0123456789abcdef \
            -e PROVIDER_RUNTIME_ENABLED=false \
            -e PROVIDER_RUNTIME_KILL_SWITCH=true \
            -e ENABLE_OUTBOUND_DISPATCH=false \
            -e WHATSAPP_ENABLED=false \
            -e WHATSAPP_EMBEDDED_SIGNUP_ENABLED=false \
            -e WHATSAPP_MEDIA_ENABLED=false \
            -e WHATSAPP_MEDIA_SCANNER=disabled \
            "nexus-ci:$SOURCE_SHA" python -m alembic upgrade head
      - name: Start isolated candidate and prove health
        env:
          SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
          DATABASE_URL: postgresql+psycopg://nexus_image:nexus_image_only@127.0.0.1:55432/nexus_image_acceptance
        run: |
          docker run -d --name nexus-ci-candidate --network host \
            -e PYTHONPATH=/app/backend \
            -e APP_ENV=test \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET_KEY=ci-only-not-a-production-secret-0123456789abcdef \
            -e AI_REPLY_CONTRACT_SECRET=ci-only-contract-secret-0123456789abcdef \
            -e PROVIDER_RUNTIME_ENABLED=false \
            -e PROVIDER_RUNTIME_TRAFFIC_MODE=control \
            -e PROVIDER_RUNTIME_KILL_SWITCH=true \
            -e PROVIDER_RUNTIME_CANARY_PERCENT=0 \
            -e PRIVATE_AI_RUNTIME_ENABLED=false \
            -e WEBCHAT_AI_ENABLED=false \
            -e WEBCHAT_HUMAN_CALL_ENABLED=false \
            -e WEBCHAT_LIVE_AI_VOICE_ENABLED=false \
            -e ENABLE_OUTBOUND_DISPATCH=false \
            -e OUTBOUND_PROVIDER=disabled \
            -e WHATSAPP_ENABLED=false \
            -e WHATSAPP_EMBEDDED_SIGNUP_ENABLED=false \
            -e WHATSAPP_MEDIA_ENABLED=false \
            -e WHATSAPP_MEDIA_SCANNER=disabled \
            -e SPEEDAF_MCP_ENABLED=false \
            -e OPERATIONS_DISPATCH_MODE=disabled \
            "nexus-ci:$SOURCE_SHA"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /tmp/nexus-image/healthz.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz | tee /tmp/nexus-image/healthz.json
          curl --fail --silent http://127.0.0.1:8080/readyz | tee /tmp/nexus-image/readyz.json
          docker logs nexus-ci-candidate > /tmp/nexus-image/candidate.log 2>&1
      - name: Run controlled release-image assurance
        env:
          SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
          CANDIDATE_IMAGE: nexus-ci:${{ needs.candidate-identity.outputs.source_sha }}
          RELEASE_IMAGE_DIR: /tmp/nexus-image
        run: bash scripts/release/run_controlled_image_assurance.sh
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-smoke-${{ needs.candidate-identity.outputs.source_sha }}
          path: /tmp/nexus-image
          if-no-files-found: warn
          retention-days: 30
      - name: Remove isolated candidate
        if: always()
        run: docker rm -f nexus-ci-candidate >/dev/null 2>&1 || true

  required-gate:
    name: required-gate
    if: always()
    needs:
      - validation-mode
      - candidate-identity
      - review-governance
      - development-fast
      - static-authority
      - security-supply-chain
      - sidecar-supply-chain
      - backend-full
      - frontend-browser
      - postgres-acceptance
      - image-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce fail-closed mode result
        shell: bash
        env:
          MODE: ${{ needs.validation-mode.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_MODE: ${{ needs.validation-mode.result }}
          CANDIDATE_IDENTITY: ${{ needs.candidate-identity.result }}
          REVIEW_GOVERNANCE: ${{ needs.review-governance.result }}
          DEVELOPMENT_FAST: ${{ needs.development-fast.result }}
          STATIC_AUTHORITY: ${{ needs.static-authority.result }}
          SECURITY_SUPPLY_CHAIN: ${{ needs.security-supply-chain.result }}
          SIDECAR_SUPPLY_CHAIN: ${{ needs.sidecar-supply-chain.result }}
          BACKEND_FULL: ${{ needs.backend-full.result }}
          FRONTEND_BROWSER: ${{ needs.frontend-browser.result }}
          POSTGRES_ACCEPTANCE: ${{ needs.postgres-acceptance.result }}
          IMAGE_SMOKE: ${{ needs.image-smoke.result }}
        run: |
          set -Eeuo pipefail
          test "$VALIDATION_MODE" = "success"
          test "$CANDIDATE_IDENTITY" = "success"
          case "$MODE" in
            development)
              test "$REVIEW_GOVERNANCE" = "skipped"
              test "$DEVELOPMENT_FAST" = "success"
              for result in \
                "$STATIC_AUTHORITY" \
                "$SECURITY_SUPPLY_CHAIN" \
                "$SIDECAR_SUPPLY_CHAIN" \
                "$BACKEND_FULL" \
                "$FRONTEND_BROWSER" \
                "$POSTGRES_ACCEPTANCE" \
                "$IMAGE_SMOKE"
              do
                test "$result" = "skipped"
              done
              ;;
            candidate|main)
              if [[ "$MODE" = "candidate" && ( "$EVENT_NAME" = "pull_request" || "$EVENT_NAME" = "pull_request_review" ) ]]; then
                test "$REVIEW_GOVERNANCE" = "success"
              else
                test "$REVIEW_GOVERNANCE" = "skipped"
              fi
              test "$DEVELOPMENT_FAST" = "skipped"
              for result in \
                "$STATIC_AUTHORITY" \
                "$SECURITY_SUPPLY_CHAIN" \
                "$SIDECAR_SUPPLY_CHAIN" \
                "$BACKEND_FULL" \
                "$FRONTEND_BROWSER" \
                "$POSTGRES_ACCEPTANCE" \
                "$IMAGE_SMOKE"
              do
                test "$result" = "success"
              done
              ;;
            *)
              echo "invalid validation mode: $MODE" >&2
              exit 2
              ;;
          esac
