name: one-shot-909-final-main-evidence

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'audit/909-final-main-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 55ee9165b6623fbe5d6b68ba215cfe2a28efa8d1
          persist-credentials: false
      - name: Print bounded visitor-token authority writes
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -RIn --include='*.py' -E 'visitor_token_hash[[:space:]]*=|setattr\([^,]+,[[:space:]]*["'"']visitor_token_hash' backend/app || true
          grep -RIn --include='*.py' -E 'visitor_token_expires_at[[:space:]]*=' backend/app || true
          grep -RIn --include='*.py' -E 'WebchatConversation\(' backend/app/services backend/app/api | head -n 100
