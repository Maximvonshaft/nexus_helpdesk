name: one-shot-898-final-postmerge-observer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    if: github.head_ref == 'audit/898-final-postmerge-observer-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      MAIN_SHA: 617bc8b30b75dbc1f0fc5ae9dab7a1e8862cc917
      EVIDENCE_DIR: artifacts/final-postmerge-observer
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 617bc8b30b75dbc1f0fc5ae9dab7a1e8862cc917
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"

      - name: Observe official exact-main workflow chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["MAIN_SHA"]
          token = os.environ["GH_TOKEN"]
          out = Path(os.environ["EVIDENCE_DIR"])
          api = "https://api.github.com"
          required_jobs = {
              "guard-main",
              "build-assure-publish",
              "recovery",
              "bind-and-attest",
          }

          def get(path: str) -> dict:
              request = urllib.request.Request(
                  api + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nexus-final-postmerge-observer",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def compact(run: dict | None) -> dict | None:
              if run is None:
                  return None
              return {
                  key: run.get(key)
                  for key in (
                      "id", "name", "event", "status", "conclusion",
                      "head_branch", "head_sha", "run_number", "run_attempt",
                      "created_at", "updated_at", "html_url", "path",
                  )
              }

          canonical = None
          controlled = None
          controlled_jobs = None
          for _ in range(480):
              encoded = urllib.parse.quote(sha, safe="")
              payload = get(f"/repos/{repo}/actions/runs?head_sha={encoded}&per_page=100")
              runs = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == sha
              ]
              canonical_runs = [
                  run for run in runs
                  if run.get("name") == "Canonical Acceptance"
                  and run.get("event") == "push"
                  and run.get("head_branch") == "main"
              ]
              canonical_runs.sort(
                  key=lambda run: (run.get("created_at") or "", int(run["id"]))
              )
              canonical = canonical_runs[-1] if canonical_runs else None

              controlled_runs = [
                  run for run in runs
                  if run.get("name") == "controlled-candidate-convergence"
                  and run.get("event") == "workflow_run"
              ]
              controlled_runs.sort(
                  key=lambda run: (run.get("created_at") or "", int(run["id"]))
              )
              controlled = controlled_runs[-1] if controlled_runs else None

              observation = {
                  "schema": "nexus.final_postmerge_workflow_observation.v2",
                  "observed_at": datetime.now(timezone.utc).isoformat(),
                  "main_sha": sha,
                  "canonical": compact(canonical),
                  "controlled": compact(controlled),
              }
              (out / "workflow-observation.json").write_text(
                  json.dumps(observation, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              if canonical and canonical.get("status") == "completed":
                  if canonical.get("conclusion") != "success":
                      raise SystemExit(
                          f"exact-main Canonical failed: {canonical.get('id')} "
                          f"{canonical.get('conclusion')}"
                      )
                  if controlled and controlled.get("status") == "completed":
                      if controlled.get("conclusion") != "success":
                          raise SystemExit(
                              f"Controlled Convergence failed: {controlled.get('id')} "
                              f"{controlled.get('conclusion')}"
                          )
                      jobs_payload = get(
                          f"/repos/{repo}/actions/runs/{controlled['id']}/jobs?per_page=100"
                      )
                      jobs = jobs_payload.get("jobs", [])
                      by_name = {job.get("name"): job for job in jobs}
                      missing = sorted(required_jobs - set(by_name))
                      failed = {
                          name: (by_name.get(name) or {}).get("conclusion")
                          for name in sorted(required_jobs)
                          if (by_name.get(name) or {}).get("conclusion") != "success"
                      }
                      if missing or failed:
                          raise SystemExit(
                              f"Controlled jobs invalid; missing={missing}; failed={failed}"
                          )
                      controlled_jobs = {
                          name: {
                              "id": by_name[name].get("id"),
                              "status": by_name[name].get("status"),
                              "conclusion": by_name[name].get("conclusion"),
                          }
                          for name in sorted(required_jobs)
                      }
                      break
              time.sleep(15)
          else:
              raise SystemExit("exact-main workflow chain did not reach terminal success")

          result = {
              "schema": "nexus.final_postmerge_workflow_result.v2",
              "status": "pass",
              "main_sha": sha,
              "canonical": compact(canonical),
              "controlled": compact(controlled),
              "controlled_jobs": controlled_jobs,
          }
          (out / "workflow-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify bounded observer evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$EVIDENCE_DIR/workflow-observation.json"
          if test -f "$EVIDENCE_DIR/workflow-result.json"; then
            test "$(jq -r '.status' "$EVIDENCE_DIR/workflow-result.json")" = "pass"
            test "$(jq -r '.main_sha' "$EVIDENCE_DIR/workflow-result.json")" = "$MAIN_SHA"
          fi

      - name: Upload final exact-main workflow observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-postmerge-observer-617bc8b3
          path: artifacts/final-postmerge-observer
          retention-days: 14
          if-no-files-found: error
