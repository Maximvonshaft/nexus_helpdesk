name: one-shot-898-final-postmerge-observer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  observe:
    if: github.head_ref == 'audit/898-final-postmerge-observer-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      MAIN_SHA: 36ccc400ab4a3b612fa4e5f3bed0a5e0d65a68c9
      CANONICAL_RUN_ID: '30779665117'
      EVIDENCE_DIR: artifacts/final-postmerge-observer
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 36ccc400ab4a3b612fa4e5f3bed0a5e0d65a68c9
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"

      - name: Bind and verify official workflow chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["MAIN_SHA"]
          canonical_id = int(os.environ["CANONICAL_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          out = Path(os.environ["EVIDENCE_DIR"])
          required_jobs = {
              "guard-main",
              "build-assure-publish",
              "recovery",
              "bind-and-attest",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nexus-final-postmerge-observer",
          }

          def get_json(path: str) -> dict:
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def get_text(path: str) -> str:
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8", errors="replace")

          canonical = get_json(f"/repos/{repo}/actions/runs/{canonical_id}")
          expected_canonical = {
              "name": "Canonical Acceptance",
              "event": "push",
              "head_branch": "main",
              "head_sha": sha,
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in expected_canonical.items():
              if canonical.get(key) != value:
                  raise SystemExit(f"canonical mismatch: {key}={canonical.get(key)!r}, expected={value!r}")

          controlled = None
          controlled_jobs = None
          guard_log = None
          for _ in range(480):
              payload = get_json(f"/repos/{repo}/actions/runs?event=workflow_run&per_page=100")
              candidates = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("name") == "controlled-candidate-convergence"
                  and run.get("created_at", "") >= canonical.get("updated_at", "")
              ]
              candidates.sort(key=lambda run: (run.get("created_at") or "", int(run["id"])))
              for run in candidates:
                  jobs_payload = get_json(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
                  jobs = jobs_payload.get("jobs", [])
                  guard = next((job for job in jobs if job.get("name") == "guard-main"), None)
                  if not guard or guard.get("status") != "completed":
                      continue
                  try:
                      log = get_text(f"/repos/{repo}/actions/jobs/{guard['id']}/logs")
                  except urllib.error.HTTPError:
                      continue
                  markers = (
                      f"CANDIDATE_SHA: {sha}",
                      f"SOURCE_SHA: {sha}",
                      f"TRIGGER_RUN_ID: {canonical_id}",
                      "TRIGGER_NAME: Canonical Acceptance",
                      "TRIGGER_EVENT: push",
                      "TRIGGER_BRANCH: main",
                      "TRIGGER_CONCLUSION: success",
                  )
                  if all(marker in log for marker in markers):
                      controlled = run
                      controlled_jobs = {job.get("name"): job for job in jobs}
                      guard_log = log
                      break
              observation = {
                  "schema": "nexus.final_postmerge_workflow_observation.v4",
                  "observed_at": datetime.now(timezone.utc).isoformat(),
                  "main_sha": sha,
                  "canonical_run_id": canonical_id,
                  "controlled_run_id": controlled.get("id") if controlled else None,
              }
              (out / "workflow-observation.json").write_text(
                  json.dumps(observation, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              if controlled:
                  if controlled.get("status") != "completed":
                      time.sleep(15)
                      continue
                  if controlled.get("conclusion") != "success":
                      raise SystemExit(
                          f"official Controlled failed: {controlled.get('id')} {controlled.get('conclusion')}"
                      )
                  missing = sorted(required_jobs - set(controlled_jobs))
                  failed = {
                      name: (controlled_jobs.get(name) or {}).get("conclusion")
                      for name in sorted(required_jobs)
                      if (controlled_jobs.get(name) or {}).get("conclusion") != "success"
                  }
                  if missing or failed:
                      raise SystemExit(f"official Controlled jobs invalid; missing={missing}; failed={failed}")
                  break
              time.sleep(15)
          else:
              raise SystemExit("official Controlled run was not bound to exact Canonical trigger")

          result = {
              "schema": "nexus.final_postmerge_workflow_result.v4",
              "status": "pass",
              "main_sha": sha,
              "canonical": {
                  key: canonical.get(key)
                  for key in ("id", "name", "event", "head_branch", "head_sha", "status", "conclusion", "html_url")
              },
              "controlled": {
                  key: controlled.get(key)
                  for key in ("id", "name", "event", "head_branch", "head_sha", "status", "conclusion", "html_url")
              },
              "controlled_jobs": {
                  name: {
                      "id": controlled_jobs[name].get("id"),
                      "status": controlled_jobs[name].get("status"),
                      "conclusion": controlled_jobs[name].get("conclusion"),
                  }
                  for name in sorted(required_jobs)
              },
              "guard_trigger_binding": {
                  "canonical_run_id": canonical_id,
                  "source_sha": sha,
                  "event": "push",
                  "branch": "main",
                  "conclusion": "success",
              },
          }
          (out / "workflow-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify bounded observer evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$EVIDENCE_DIR/workflow-observation.json"
          if test -f "$EVIDENCE_DIR/workflow-result.json"; then
            test "$(jq -r '.status' "$EVIDENCE_DIR/workflow-result.json")" = "pass"
            test "$(jq -r '.main_sha' "$EVIDENCE_DIR/workflow-result.json")" = "$MAIN_SHA"
            test "$(jq -r '.canonical.id' "$EVIDENCE_DIR/workflow-result.json")" = "$CANONICAL_RUN_ID"
          fi

      - name: Upload final exact-main workflow observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-postmerge-observer-36ccc400-v2
          path: artifacts/final-postmerge-observer
          retention-days: 14
          if-no-files-found: error
